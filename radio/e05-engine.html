<script>
/* ================= HOME MUSIC ENGINE v5 : drives the pixel rite ================= */
(function(){
"use strict";

var $ = function(id){ return document.getElementById(id); };
var RIG = window.RIG || {ok:false, ctl:{}, prepare:function(k,cb){ if(cb) setTimeout(cb,300); },
  fadeBegin:function(){}, setFade:function(){}, finish:function(){}, quick:function(){},
  first:function(){}, setLevels:function(){}, setProgress:function(){}, setTempo:function(){}, setNext:function(){}};
var SIMPLE = window.matchMedia("(pointer:coarse)").matches; /* touch devices: single player, rig still performs */
var XFADE_LEAD = 24;     /* o rito completo do vinil leva ~11s antes de a rampa poder comecar */
var FADE_DUR = 6000;     /* ms, the audible crossfade; the rig hand rides the knob in sync */

/* ---------------- FX : web audio dub kit ---------------- */
var FX = {
  ctx:null, master:null, echoIn:null,
  init: function(){
    if(this.ctx) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7;
      this.master.connect(this.ctx.destination);
      var delay = this.ctx.createDelay(1.5); delay.delayTime.value = 0.36;
      var fb = this.ctx.createGain(); fb.gain.value = 0.52;
      var lp = this.ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 1700;
      delay.connect(lp); lp.connect(fb); fb.connect(delay);
      var wet = this.ctx.createGain(); wet.gain.value = 0.9;
      delay.connect(wet); wet.connect(this.master);
      this.echoIn = delay;
    }catch(e){ this.ctx = null; }
  },
  resume: function(){ if(this.ctx && this.ctx.state === "suspended"){ this.ctx.resume(); } },
  setVol: function(v){ if(this.master) this.master.gain.value = 0.7 * v; },
  env: function(g, t0, a, peak, rel){
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + rel);
  },
  stab: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime, g=c.createGain();
    var bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=900; bp.Q.value=1.1;
    g.connect(bp);
    var dry=c.createGain(); dry.gain.value=0.35; bp.connect(dry); dry.connect(this.master);
    var s=c.createGain(); s.gain.value=0.75; bp.connect(s); s.connect(this.echoIn);
    [220, 261.6, 329.6].forEach(function(f,i){
      var o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=f; o.detune.value=(i-1)*7;
      o.connect(g); o.start(t); o.stop(t+0.4);
    });
    this.env(g, t, 0.01, 0.24, 0.3);
  },
  phone: function(){
    if(!this.ctx) return;
    var c=this.ctx, self=this, pairs=[[697,1209],[770,1336],[852,1477],[941,1336],[770,1209]];
    pairs.forEach(function(p,i){
      var t=c.currentTime + i*0.13, g=c.createGain();
      var dry=c.createGain(); dry.gain.value=0.5; g.connect(dry); dry.connect(self.master);
      var s=c.createGain(); s.gain.value=0.5; g.connect(s); s.connect(self.echoIn);
      p.forEach(function(f){
        var o=c.createOscillator(); o.type="sine"; o.frequency.value=f;
        o.connect(g); o.start(t); o.stop(t+0.12);
      });
      self.env(g, t, 0.005, 0.11, 0.1);
    });
  },
  siren: function(dur){
    if(!this.ctx) return;
    dur = dur || 1.2;
    var c=this.ctx, t=c.currentTime;
    var o=c.createOscillator(); o.type="triangle"; o.frequency.value=540;
    var lfo=c.createOscillator(); lfo.type="sine"; lfo.frequency.value=4.2;
    var lg=c.createGain(); lg.gain.value=130; lfo.connect(lg); lg.connect(o.frequency);
    var g=c.createGain(); o.connect(g);
    var dry=c.createGain(); dry.gain.value=0.05; g.connect(dry); dry.connect(this.master);
    var s=c.createGain(); s.gain.value=0.6; g.connect(s); s.connect(this.echoIn);
    o.start(t); lfo.start(t); o.stop(t+dur+0.1); lfo.stop(t+dur+0.1);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.08, t+0.1);
    g.gain.setValueAtTime(0.08, t+dur-0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  },
  kick: function(at){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime+(at||0);
    var o=c.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(96,t); o.frequency.exponentialRampToValueAtTime(48, t+0.12);
    var g=c.createGain(); o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+0.3);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.32, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.26);
  },
  rim: function(at, wet){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime+(at||0);
    var len=Math.floor(c.sampleRate*0.06), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2); }
    var src=c.createBufferSource(); src.buffer=buf;
    var bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1900; bp.Q.value=2.2;
    var g=c.createGain(); g.gain.value=0.16;
    src.connect(bp); bp.connect(g); g.connect(this.master);
    if(wet){ var s2=c.createGain(); s2.gain.value=0.9; g.connect(s2); s2.connect(this.echoIn); }
    src.start(t);
  },
  bubble: function(at){
    if(!this.ctx) return;
    var c=this.ctx, self=this, t0=at||0;
    [0,0.17].forEach(function(dt0,i){
      var t=c.currentTime+t0+dt0, g2=c.createGain();
      var lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=760;
      g2.connect(lp);
      var dry=c.createGain(); dry.gain.value=0.3; lp.connect(dry); dry.connect(self.master);
      var s2=c.createGain(); s2.gain.value=0.35; lp.connect(s2); s2.connect(self.echoIn);
      [146.8, 220].forEach(function(f){
        var o=c.createOscillator(); o.type="square"; o.frequency.value=f*(i?1.002:1);
        o.connect(g2); o.start(t); o.stop(t+0.11);
      });
      self.env(g2, t, 0.004, 0.09, 0.09);
    });
  },
  oneDrop: function(){
    /* dois compassos de one drop a 72 BPM: kick no 3, rim com eco no 3 e meio */
    var self=this, beat=60/72;
    [0,1].forEach(function(bar){
      var b0=bar*4*beat;
      self.kick(b0+2*beat);
      self.rim(b0+2*beat, true);
      self.rim(b0+3.5*beat, bar===1);
      self.bubble(b0+1*beat); self.bubble(b0+3*beat);
    });
  },
  needleDrop: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime, self=this;
    /* toque surdo do braco a pousar */
    var o=c.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(82,t); o.frequency.exponentialRampToValueAtTime(48, t+0.07);
    var g=c.createGain(); o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+0.12);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.18, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.11);
    /* estalido do contacto */
    var len=Math.floor(c.sampleRate*0.05), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.4); }
    var src=c.createBufferSource(); src.buffer=buf;
    var hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1400;
    var g2=c.createGain(); g2.gain.value=0.2;
    src.connect(hp); hp.connect(g2); g2.connect(this.master);
    var s2=c.createGain(); s2.gain.value=0.5; g2.connect(s2); s2.connect(this.echoIn);
    src.start(t+0.03);
    /* chiado do sulco a assentar */
    var ln2=Math.floor(c.sampleRate*2.2), b2=c.createBuffer(1,ln2,c.sampleRate), d2=b2.getChannelData(0);
    for(var j=0;j<ln2;j++){ d2[j]=(Math.random()*2-1)*0.5 + ((Math.random()<0.004)?(Math.random()*2-1)*1.6:0); }
    var sr2=c.createBufferSource(); sr2.buffer=b2;
    var bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=5200; bp.Q.value=0.8;
    var g3=c.createGain();
    sr2.connect(bp); bp.connect(g3); g3.connect(this.master);
    sr2.start(t+0.06);
    g3.gain.setValueAtTime(0.0001,t+0.06);
    g3.gain.linearRampToValueAtTime(0.085, t+0.3);
    g3.gain.setValueAtTime(0.085, t+1.2);
    g3.gain.exponentialRampToValueAtTime(0.0001, t+2.2);
  },
  sub: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime;
    var o=c.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(62,t); o.frequency.exponentialRampToValueAtTime(40, t+0.7);
    var g=c.createGain(); o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+0.95);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.3, t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.9);
  },
  skank: function(){
    if(!this.ctx) return;
    var c=this.ctx, self=this;
    [0,0.34].forEach(function(dt0){
      var t=c.currentTime+dt0, g2=c.createGain();
      var lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1200;
      g2.connect(lp);
      var dry=c.createGain(); dry.gain.value=0.2; lp.connect(dry); dry.connect(self.master);
      var s2=c.createGain(); s2.gain.value=0.7; lp.connect(s2); s2.connect(self.echoIn);
      [174.6, 220, 261.6].forEach(function(f){
        var o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=f;
        o.connect(g2); o.start(t); o.stop(t+0.22);
      });
      self.env(g2, t, 0.005, 0.12, 0.16);
    });
  },
  horn: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime, g2=c.createGain();
    var lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900;
    g2.connect(lp);
    var dry=c.createGain(); dry.gain.value=0.3; lp.connect(dry); dry.connect(this.master);
    var s2=c.createGain(); s2.gain.value=0.8; lp.connect(s2); s2.connect(this.echoIn);
    [110, 164.8, 220].forEach(function(f,i){
      var o=c.createOscillator(); o.type="sawtooth"; o.frequency.value=f; o.detune.value=(i-1)*5;
      o.connect(g2); o.start(t); o.stop(t+1.3);
    });
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.linearRampToValueAtTime(0.16, t+0.5);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+1.25);
  },
  sweep: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime;
    var o=c.createOscillator(); o.type="sawtooth";
    o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(980, t+0.7);
    var g=c.createGain(); o.connect(g);
    var s=c.createGain(); s.gain.value=0.8; g.connect(s); s.connect(this.echoIn);
    var dry=c.createGain(); dry.gain.value=0.12; g.connect(dry); dry.connect(this.master);
    o.start(t); o.stop(t+0.85);
    this.env(g, t, 0.04, 0.16, 0.75);
  },
  rewind: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime;
    var o=c.createOscillator(); o.type="sawtooth";
    o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(55, t+0.45);
    var g=c.createGain(); o.connect(g); g.connect(this.master);
    var s=c.createGain(); s.gain.value=0.5; g.connect(s); s.connect(this.echoIn);
    o.start(t); o.stop(t+0.5);
    this.env(g, t, 0.01, 0.22, 0.42);
  },
  crackle: function(on){
    if(!this.ctx) return;
    if(on){
      if(this._ck) return;
      var c=this.ctx, len=c.sampleRate*2, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i] = (Math.random() < 0.0018) ? (Math.random()*2-1)*0.8 : (Math.random()*2-1)*0.012; }
      var src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      var g=c.createGain(); g.gain.value=0.16; src.connect(g); g.connect(this.master);
      src.start(); this._ck={src:src,g:g};
    }else if(this._ck){
      var ck=this._ck; this._ck=null;
      ck.g.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime+0.6);
      setTimeout(function(){ try{ck.src.stop();}catch(e){} }, 700);
    }
  },
  /* o crepitar como na realidade: uma janela curta que se apaga sozinha */
  crackleBurst: function(dur){
    if(!this.ctx) return;
    this.crackle(true);
    var self=this;
    clearTimeout(this._ckT);
    this._ckT=setTimeout(function(){ self.crackle(false); }, Math.max(300,(dur||2.2)*1000));
  },
  /* levantar a agulha: varrimento leve, estalido, meio segundo de sulco e silencio */
  needleLift: function(){
    if(!this.ctx) return;
    var c=this.ctx, t=c.currentTime;
    var o=c.createOscillator(); o.type="sine";
    o.frequency.setValueAtTime(52,t); o.frequency.exponentialRampToValueAtTime(90,t+0.09);
    var g=c.createGain(); o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+0.14);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.12,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
    var len=Math.floor(c.sampleRate*0.04), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.2); }
    var src=c.createBufferSource(); src.buffer=buf;
    var hp=c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1600;
    var g2=c.createGain(); g2.gain.value=0.14;
    src.connect(hp); hp.connect(g2); g2.connect(this.master);
    src.start(t+0.05);
  },
  transitionFx: function(){
    var self=this;
    self.kick(); self.rim(0.02,true);
    setTimeout(function(){ self.bubble(); }, 480);
    setTimeout(function(){ self.sub(); }, 1100);
    setTimeout(function(){ self.rim(0,true); }, 1900);
    if(Math.random()<0.4){ setTimeout(function(){ self.phone(); }, 2600); }
  }
};

/* tempo per genre: the resident's groove locks to what is on air */
var GBPM={ reggae:76, dub:72, lofi:80, ambient:64, ambient_techno:112,
  lofi_house:118, liquid:174, intelligent_dnb:168, atmospheric_jungle:158,
  breakbeat:132, hypnotic_techno:132, deep_house:122, ragga_jungle:164, dubstep:140,
  dub_techno:118, oldskool_hardcore:150, ska_rocksteady:94, uk_garage:133, house:124, focus_zen:60 };

function metaFor(t){
  return { a:t.a, t:t.t, y:t.y, bpm:(t.bpm||GBPM[t.g]||120), accent:(BLOCKS[currentBlock]&&BLOCKS[currentBlock].accent)||"#ffb12b" };
}

/* ---------------- scheduling ---------------- */
function blockKeyFor(h){ if(h>=6 && h<13) return "morning"; if(h>=13 && h<20) return "afternoon"; return "night"; }
var OVERRIDE = (function(){
  try{
    var m = window.location.search.match(/[?&]block=(morning|afternoon|night)/);
    return m ? m[1] : null;
  }catch(e){ return null; }
})();
var currentBlock = OVERRIDE || blockKeyFor(new Date().getHours());
var deadIds = {};
var current = null;
/* vizinhanca entre generos: a transicao muda sempre para um som familiar */
var ADJ={
  reggae:["dub","ska_rocksteady"],
  dub:["reggae","ska_rocksteady","lofi","ambient_techno","dub_techno","dubstep"],
  ska_rocksteady:["reggae","dub"],
  lofi:["dub","ambient","lofi_house"],
  ambient:["lofi","ambient_techno","dub_techno","liquid"],
  ambient_techno:["ambient","dub","dub_techno","deep_house","hypnotic_techno"],
  dub_techno:["dub","ambient","ambient_techno","deep_house","hypnotic_techno"],
  lofi_house:["lofi","deep_house","breakbeat","liquid"],
  liquid:["intelligent_dnb","atmospheric_jungle","ambient","lofi_house"],
  intelligent_dnb:["liquid","atmospheric_jungle"],
  atmospheric_jungle:["liquid","intelligent_dnb","ragga_jungle","oldskool_hardcore","breakbeat"],
  breakbeat:["lofi_house","atmospheric_jungle","oldskool_hardcore","hypnotic_techno"],
  deep_house:["lofi_house","hypnotic_techno","ambient_techno","dub_techno"],
  hypnotic_techno:["deep_house","ambient_techno","dub_techno","dubstep","breakbeat"],
  dubstep:["hypnotic_techno","ragga_jungle","dub"],
  ragga_jungle:["dubstep","atmospheric_jungle","oldskool_hardcore"],
  oldskool_hardcore:["ragga_jungle","breakbeat","atmospheric_jungle"]
};
var pools={}, currentGenre=null, runLeft=0;

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; }
  return arr;
}
function poolFor(gn){
  if(!pools[gn] || !pools[gn].length){
    pools[gn] = shuffle(TRACKS.filter(function(t){ return t.g===gn && !deadIds[t.v]; }));
  }
  return pools[gn];
}
function genreHasTracks(gn){
  return TRACKS.some(function(t){ return t.g===gn && !deadIds[t.v]; });
}
function pickGenre(fromG){
  var bg = BLOCKS[currentBlock].genres.filter(genreHasTracks);
  if(!bg.length) return null;
  function dBpm(a,b){ return Math.abs((GBPM[a]||120)-(GBPM[b]||120)); }
  if(fromG && ADJ[fromG]){
    var near = ADJ[fromG].filter(function(gn){ return bg.indexOf(gn)>=0 && gn!==fromG; });
    if(near.length){
      /* entre os primos, o de tempo mais proximo quase sempre: a corrente nao da saltos */
      near.sort(function(a,b){ return dBpm(a,fromG)-dBpm(b,fromG); });
      return (near.length>1 && Math.random()<0.28) ? near[1] : near[0];
    }
    /* sem primo direto no bloco: o genero do bloco com o BPM mais proximo */
    var rest = bg.filter(function(gn){ return gn!==fromG; });
    if(rest.length){
      rest.sort(function(a,b){ return dBpm(a,fromG)-dBpm(b,fromG); });
      return rest[0];
    }
  }
  return bg[Math.floor(Math.random()*bg.length)];
}
function buildQueue(){ currentGenre=null; runLeft=0; }
function nextTrack(){
  var bg = BLOCKS[currentBlock].genres;
  if(!currentGenre || bg.indexOf(currentGenre)<0 || !genreHasTracks(currentGenre) || runLeft<=0){
    var nx = pickGenre(currentGenre);
    if(!nx) return null;
    currentGenre = nx;
    runLeft = 3 + Math.floor(Math.random()*3);
  }
  var pool = poolFor(currentGenre);
  if(!pool.length) return null;
  var t = pool.shift();
  if(current && t && t.v === current.v && pool.length){ pool.push(t); t = pool.shift(); }
  runLeft--;
  return t;
}

/* ---------------- YouTube players + mix state ---------------- */
var apiReady=false, started=false, radioOn=false;
var P = { A:{k:"A", yt:null, slot:"slotA", ready:false}, B:{k:"B", yt:null, slot:"slotB", ready:false} };
var activeKey="A";
var rigDeck="A";             /* which rig deck currently holds the live stream */
var masterVol = 80;
var muted=false;
var transitioning=false;
var retryCount=0;
var lastT=0, lastStamp=0;

try{ var sv = localStorage.getItem("hm_vol"); if(sv!==null){ masterVol = Math.max(0, Math.min(100, parseInt(sv,10)||80)); } }catch(e){}

function other(k){ return k==="A" ? "B" : "A"; }
function deckOfPlayer(k){ return SIMPLE ? rigDeck : k; }
function applyVol(k){
  var p=P[k]; if(!p || !p.ready || !p.yt) return;
  var f = (p.fade==null?1:p.fade);
  try{ p.yt.setVolume(Math.round(Math.max(0, Math.min(100, masterVol * f)))); }catch(e){}
}
function fadeVol(p, f){ p.fade = f; applyVol(p.k); }
function audibleLevel(k){
  var p=P[k]; if(!p || !p.ready || !p.yt) return 0;
  var st=-9; try{ st=p.yt.getPlayerState(); }catch(e){ return 0; }
  if(st!==1 || muted) return 0;
  var f = (p.fade==null?1:p.fade);
  return (masterVol/100) * f;
}

/* feed the VU meters and the tonearm creep */
setInterval(function(){
  if(!radioOn) return;
  /* o botao segue sempre o estado real */
  var mb=$("muteBtn");
  if(mb){ var want = muted ? "Unmute" : "Mute"; if(mb.textContent!==want){ mb.textContent=want; mb.classList.toggle("on", muted); } }
  var la=0, lb=0;
  ["A","B"].forEach(function(k){
    var v = audibleLevel(k);
    if(deckOfPlayer(k)==="A"){ la=Math.max(la,v); } else { lb=Math.max(lb,v); }
  });
  RIG.setLevels(la, lb);
}, 280);

window.onYouTubeIframeAPIReady = function(){
  apiReady = true;
  makePlayer("A"); if(!SIMPLE) makePlayer("B");
};
function ensureLoaded(p, vid){
  if(!p || !p.ready || !p.yt || !vid) return false;
  if(p.loadedId === vid) return true;
  try{ p.yt.loadVideoById(vid); p.loadedId = vid; return true; }catch(e){ return false; }
}
function makePlayer(k){
  var p = P[k];
  p.yt = new YT.Player("yt"+k, {
    width:"100%", height:"100%",
    playerVars:{ autoplay:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, modestbranding:1, rel:0, playsinline:1,
      origin: window.location.origin, widget_referrer: window.location.href },
    events:{
      onReady: function(e){ p.yt = e.target; p.ready=true; if(k==="A"){ maybeStart(); } },
      onStateChange: function(e){ onState(k, e.data); },
      onError: function(e){ onYtError(k, e.data); }
    }
  });
}
function loadApi(){
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = function(){ apiFail(); };
  document.head.appendChild(s);
  setTimeout(function(){ if(!apiReady) apiFail(); }, 9000);
}
var apiFailed = false;
function apiFail(){
  if(apiReady) return;
  apiFailed = true;
  $("standbyMsg").textContent = "cannot reach YouTube from this network. the radio needs it to spin.";
}

/* start sequence: user pressed play, intro runs, radio starts */
/* relogio de animacao que nao adormece: setInterval corre em separadores ocultos
   (com passos mais grossos), ao contrario do requestAnimationFrame; usar para
   TODAS as rampas de audio e maquinas de transicao. step devolve false para abortar. */
function animClock(dur, step, done){
  var t0=performance.now();
  var h=setInterval(function(){
    var x=Math.min(1,(performance.now()-t0)/dur);
    var cont=step(x);
    if(cont===false){ clearInterval(h); return; }
    if(x>=1){ clearInterval(h); if(done) done(); }
  }, 50);
  return h;
}
var pendingFirst = null;
function maybeStart(){
  if(!pendingFirst || !P.A.ready || started) return;
  try{ P.A.yt.mute(); }catch(e){}
  if(ensureLoaded(P.A, pendingFirst.v)){ started = true; }
  else { setTimeout(maybeStart, 400); }
}
var firstLogged = false;
function beginRadio(){
  radioOn = true;
  var p = P[activeKey];
  $("standbyMsg").textContent = "dropping the needle…";
  function go(){
    if(!p.ready){ if(!apiFailed){ setTimeout(go, 300); } return; }
    if(!started){ try{ p.yt.mute(); }catch(e){} if(ensureLoaded(p, pendingFirst.v)) started=true; }
    if(!started){ setTimeout(go, 500); return; }
    try{
      p.yt.unMute(); muted=false;
      fadeVol(p, 0);
      p.yt.seekTo(0, true);
      p.yt.playVideo();
    }catch(e){}
    if(!firstLogged && current){
      firstLogged = true; pushHistory(current);
      firstRampPending = true;
      /* o crackle so entra quando a agulha toca o disco: antes disso, silencio */
      if(RIG.setNext) RIG.setNext(metaFor(current));
      RIG.first(deckOfPlayer(activeKey));
      /* rede de seguranca: se o gancho da agulha nao disparar, a rampa entra na mesma */
      setTimeout(function(){ if(firstRampPending && window.HMFX){ window.HMFX.needle(); } }, 9500);
    }
    setTimeout(checkAudible, 6000);
  }
  go();
}
var needleTries = 0;
function checkAudible(){
  var p = P[activeKey];
  if(!p.ready){ setTimeout(checkAudible, 800); return; }
  var st=-9, mu=false;
  try{ st = p.yt.getPlayerState(); mu = p.yt.isMuted(); }catch(e){}
  if(st === 1 && !mu){ needleTries = 0; return; }
  if(!started && pendingFirst){ ensureLoaded(p, pendingFirst.v) && (started=true); }
  if((st === 3 || st === -1) && needleTries++ < 5){ setTimeout(checkAudible, 1200); return; }
  /* mostrar o proprio leitor para o arranque manual, venha o bloqueio de onde vier */
  $("slot"+activeKey).classList.add("live");
  $("standby").classList.add("off");
  $("needle").textContent = (st === 1 && mu) ? "muted by the browser. tap for sound" : "silent? press play on the monitor";
  $("needle").classList.add("on");
}
$("needle") && $("needle").addEventListener("click", function(){
  var p = P[activeKey];
  try{ p.yt.unMute(); muted=false; fadeVol(p,1); p.yt.playVideo(); }catch(e){}
  FX.resume();
  $("needle").classList.remove("on");
});

function onState(k, st){
  if(st === 1){
    if(k === activeKey){
      $("standby").classList.add("off");
      $("slot"+k).classList.add("live");
      var muNow=false; try{ muNow=P[k].yt.isMuted(); }catch(e){}
      if(!muNow || muted){ $("needle").classList.remove("on"); }
      lastT = 0; lastStamp = Date.now();
    }
    retryCount = 0;
  }
  if(st === 0 && k === activeKey && !transitioning){ hardNext("ended"); }
}
function onYtError(k, code){
  var p = P[k];
  if(code === 153 || code === 2){
    $("slot"+k).classList.add("live");
    $("standby").classList.add("off");
    $("needle").textContent = "player blocked by browser privacy settings";
    $("needle").classList.add("on");
    return;
  }
  var bad = p.pendingTrack || (k===activeKey ? current : null);
  if(bad){ deadIds[bad.v] = true; }
  if(transitioning && k !== activeKey){
    transitioning = false;
    if(retryCount++ < 4){ startTransition(); }
  } else if(k === activeKey){
    if(retryCount++ < 5){ hardNext("error"); }
    else { $("standbyMsg").textContent = "too many dead links in a row. check the connection."; $("standby").classList.remove("off"); }
  }
}

/* hard cut (errors, manual skip): the rig does a fast same-deck swap */
function hardNextAudio(t, quiet){
  var p = P[activeKey];
  p.pendingTrack = t;
  setNow(t, true);
  ensureLoaded(p, t.v);
  try{ p.yt.unMute(); fadeVol(p, quiet?0:1); }catch(e){}
}
var swapPending=false;
function hardNext(reason){
  if(swapPending) return;
  var t = nextTrack(); if(!t) return;
  if(reason === "ended"){
    /* o disco chegou ao fim: agulha fora, sulco a morrer, maos no proximo */
    swapPending=true;
    if(window.HMFX) HMFX.lift();
    $("standbyMsg").textContent = "changing the record\u2026";
    setTimeout(function(){
      swapPending=false;
      if(!radioOn) return;
      if(RIG.setNext) RIG.setNext(metaFor(t));
      firstRampPending=true; rampDur=2000;
      hardNextAudio(t, true);
      RIG.quick(deckOfPlayer(activeKey));
      /* salvaguarda: se o gancho da agulha nao vier, a rampa entra na mesma */
      setTimeout(function(){ if(firstRampPending && window.HMFX){ HMFX.needle(); } }, 6000);
    }, 2600);
    return;
  }
  if(RIG.setNext) RIG.setNext(metaFor(t));
  hardNextAudio(t);
  RIG.quick(deckOfPlayer(activeKey));
}

/* the changeover: the rig walks to the idle deck, swaps the record, drops the
   needle, then rides the crossfader while the audio does the same 6s ramp */
function startTransition(){
  if(transitioning || !radioOn) return;
  var t = nextTrack(); if(!t) return;

  if(SIMPLE){
    transitioning = true;
    var inD = other(rigDeck), outD = rigDeck;
    var prepped = false;
    if(RIG.setNext) RIG.setNext(metaFor(t));
    RIG.prepare(inD, function(){ prepped = true; });
    FX.transitionFx();
    var waited = 0;
    (function waitPrep(){
      if(!transitioning) return;
      if(prepped){ go(); }
      else if((waited += 250) > 14000){ go(); }
      else setTimeout(waitPrep, 250);
    })();
    function go(){
      RIG.fadeBegin(inD);
      var swapped=false;
      animClock(1900, function(x){
        if(!transitioning){ return false; }
        RIG.setFade(x, inD);
        if(x >= 0.5 && !swapped){ swapped=true; hardNextAudio(t); }
      }, function(){
        RIG.finish(outD);
        rigDeck = inD;
        transitioning = false;
        lastT=0; lastStamp=Date.now();
      });
    }
    return;
  }

  var inc = P[other(activeKey)];
  if(!inc.ready){ hardNext(); return; }
  transitioning = true;
  inc.pendingTrack = t;
  fadeVol(inc, 0);
  ensureLoaded(inc, t.v);
  try{ inc.yt.unMute(); }catch(e){}
  var inK = other(activeKey), outK = activeKey;
  var prepped = false;
  if(RIG.setNext) RIG.setNext(metaFor(t));
  RIG.prepare(inK, function(){ prepped = true; });
  FX.transitionFx();
  var waited=0;
  (function waitBoth(){
    var st=-9; try{ st = inc.yt.getPlayerState(); }catch(e){}
    if(!transitioning) return;            /* aborted by the error handler */
    if(st === 1 && prepped){ ramp(); }
    else if((waited += 250) > 30000){ transitioning=false; hardNext(); }
    else setTimeout(waitBoth, 250);
  })();
  function ramp(){
    var out = P[outK], mid=false;
    RIG.fadeBegin(inK);
    animClock(FADE_DUR, function(x){
      if(!transitioning){ return false; }
      fadeVol(out, Math.cos(x * Math.PI/2));
      fadeVol(inc, Math.sin(x * Math.PI/2));
      RIG.setFade(x, inK);
      if(x >= 0.45 && !mid){
        mid = true;
        $("slot"+inK).classList.add("live");
        $("slot"+outK).classList.remove("live");
        setNow(t, true);
      }
    }, function(){
      try{ out.yt.stopVideo(); }catch(e){}
      out.pendingTrack = null;
      RIG.finish(outK);
      activeKey = inK;
      rigDeck = inK;
      transitioning = false;
      lastT=0; lastStamp=Date.now();
    });
  }
}

/* watchdog */
setInterval(function(){
  if(!radioOn || transitioning) return;
  var p = P[activeKey]; if(!p.ready) return;
  var st=-9, cur=0, dur=0;
  try{ st=p.yt.getPlayerState(); cur=p.yt.getCurrentTime(); dur=p.yt.getDuration(); }catch(e){ return; }
  if(st === 1){
    if(cur !== lastT){ lastT=cur; lastStamp=Date.now(); }
    else if(Date.now() - lastStamp > 14000){ hardNext("stalled"); return; }
    if(dur > 0){ RIG.setProgress(deckOfPlayer(activeKey), cur/dur); }
    if(dur > 40 && (dur - cur) <= XFADE_LEAD){ startTransition(); }
  }
}, 600);

/* ---------------- tapes soundcloud: cromo nativo sobre a API oficial do widget ---------------- */
var SCT=[{dur:0, playing:false, started:false, w:null},{dur:0, playing:false, started:false, w:null}];
function scApi(cb){
  if(window.SC && SC.Widget){ cb(); return; }
  if(scApi._q){ scApi._q.push(cb); return; }
  scApi._q=[cb];
  var s=document.createElement("script"); s.src="https://w.soundcloud.com/player/api.js";
  s.onload=function(){ var q=scApi._q; scApi._q=null; q.forEach(function(f){ f(); }); };
  s.onerror=function(){ scApi._q=null; scUnfold(0); scUnfold(1); };
  document.head.appendChild(s);
}
function scFmt(ms){ var s=Math.floor(ms/1000), m=Math.floor(s/60); s=s%60; return m+":"+(s<10?"0":"")+s; }
function scUnfold(i){ var h=$("scHost"+i); if(h) h.classList.add("unfold"); }
function scAnyPlaying(){ return SCT[0].playing || SCT[1].playing; }
function scWidget(i, cb){
  if(SCT[i].w){ cb(SCT[i].w); return; }
  scApi(function(){
    var f=$("scHost"+i).querySelector("iframe");
    if(!f.src) f.src=f.getAttribute("data-src");
    var w=SC.Widget(f); SCT[i].w=w;
    w.bind(SC.Widget.Events.READY, function(){
      w.getDuration(function(d){ SCT[i].dur=d||0; scPaint(i, 0); });
    });
    w.bind(SC.Widget.Events.PLAY, function(){
      SCT[i].playing=true; SCT[i].started=true;
      $("scPlay"+i).textContent="Pause";
      mx2SideRadio(true);
      if(FX.ctx && FX.ctx.state==="running" && !SCT[i]._dropped){ SCT[i]._dropped=true; FX.needleDrop(); FX.crackleBurst(1.4); }
    });
    w.bind(SC.Widget.Events.PAUSE, function(){
      SCT[i].playing=false; $("scPlay"+i).textContent="Play";
      if(!scAnyPlaying() && !mx2.playing) mx2SideRadio(false);
    });
    w.bind(SC.Widget.Events.FINISH, function(){
      SCT[i].playing=false; SCT[i]._dropped=false; $("scPlay"+i).textContent="Play"; scPaint(i, 0);
      if(!scAnyPlaying() && !mx2.playing) mx2SideRadio(false);
    });
    w.bind(SC.Widget.Events.PLAY_PROGRESS, function(e){ scPaint(i, e.currentPosition||0); });
    w.bind(SC.Widget.Events.ERROR, function(){ scUnfold(i); });
    cb(w);
  });
}
function scPaint(i, pos){
  var d=SCT[i].dur;
  $("scFill"+i).style.width = d ? Math.min(100, pos/d*100)+"%" : "0";
  $("scTime"+i).textContent = scFmt(pos)+" / "+(d?scFmt(d):"--:--");
}
function scPauseAll(except){
  SCT.forEach(function(st, i){ if(i!==except && st.playing && st.w){ try{ st.w.pause(); }catch(e){} } });
}
function scToggle(i){
  scWidget(i, function(w){
    if(SCT[i].playing){ w.pause(); return; }
    scPauseAll(i);
    if(mx2.playing && mx2.yt){ try{ mx2.yt.pauseVideo(); }catch(e){} mx2.playing=false; $("mxPlay2").textContent="Play"; }
    w.play();
    /* se o widget nao responder (consentimento por dar, bloqueio), abre-se para a pessoa tratar la dentro */
    setTimeout(function(){ if(!SCT[i].started) scUnfold(i); }, 2600);
  });
}
[0,1].forEach(function(i){
  $("scPlay"+i).addEventListener("click", function(){ scToggle(i); });
  $("scBar"+i).addEventListener("click", function(ev){
    if(!SCT[i].started){ scToggle(i); return; }
    var r=this.getBoundingClientRect(), frac=(ev.clientX-r.left)/r.width;
    if(SCT[i].w && SCT[i].dur){ try{ SCT[i].w.seekTo(Math.max(0, Math.min(1, frac))*SCT[i].dur); }catch(e){} }
  });
});

   escolha do dono da casa: saltar de faixa custa um desafio de beat-match.
   oito toques, mediana dentro de 3 BPM do alvo (meio tempo e dobro contam);

var SK={taps:[], open:false, lockUntil:0, lockTick:null};
function skMedian(a){ var b=a.slice().sort(function(x,y){return x-y;}); var m=b.length>>1; return b.length%2? b[m] : (b[m-1]+b[m])/2; }
function skTargets(){ var t0=(current&&(current.bpm||GBPM[current.g]))||120; return [[t0,3],[t0/2,2],[t0*2,6]]; }
function skReset(){

}
function skLockLeft(){ return Math.max(0, SK.lockUntil-Date.now()); }
function skShowLock(){
  $("skPad").disabled=true;
  var m=$("skMsg"); m.className="sk-msg bad";
  function up(){
    var s=Math.ceil(skLockLeft()/1000);
    if(s<=0){ clearInterval(SK.lockTick); SK.lockTick=null; $("skPad").disabled=false; skReset(); return; }
    m.textContent="missed it. the booth is closed: "+s+" s";
  }
  up();
  if(SK.lockTick) clearInterval(SK.lockTick);
  SK.lockTick=setInterval(up, 250);
}
function skOpen(){
  if(!radioOn || !current) return;
  SK.open=true;
  $("skTarget").textContent=String(current.bpm||GBPM[current.g]||120);
  $("skill").classList.add("on");

function skCloseBox(){

  if(SK.lockTick){ clearInterval(SK.lockTick); SK.lockTick=null; }

function skPass(){
  var m=$("skMsg"); m.className="sk-msg ok"; m.textContent="locked in. pull up!";
  FX.rim(0.02,true);
  setTimeout(function(){ skCloseBox(); FX.rewind(); setTimeout(hardNext, 350); }, 650);
}
function skFail(){
  SK.lockUntil=Date.now()+20000;
  skShowLock();
}
function skTap(){
  if(skLockLeft()>0 || !SK.open) return;
  var now=performance.now();
  SK.taps.push(now);
  if(SK.taps.length>8) SK.taps.shift();
  var dots=document.querySelectorAll("#skDots i");
  for(var i=0;i<dots.length;i++) dots[i].classList.toggle("f", i<SK.taps.length);
  if(SK.taps.length>=3){
    var iv=[]; for(var j=1;j<SK.taps.length;j++) iv.push(SK.taps[j]-SK.taps[j-1]);
    var bpm=60000/skMedian(iv);
    $("skBpm").textContent=String(Math.round(bpm));
    if(SK.taps.length===8){
      var ok=skTargets().some(function(c){ return Math.abs(bpm-c[0])<=c[1]; });
      if(ok) skPass(); else skFail();
    }
  }
}

   Koncrete Roots, Sound Killah (Dub ina Midlands, Dubophonic 2014, CC BY-NC-ND 4.0).

var P1_SRC="https://archive.org/download/DPH011/04_Koncrete_Roots_Sound_Killah.mp3";

/* ---- a camada vj: plasma liquido mate, cor continua e deformacao de dominio ---- */
var vjOn=false, vjG=null, vjImg=null, vjStops=[], vjLast=0;
var VJW=192, VJH=108;
function vjInit(){
  var c=$("vj");
  vjG=c.getContext("2d");
  c.width=VJW; c.height=VJH;
  vjImg=vjG.createImageData(VJW,VJH);
  ["#030309","#0d0a22","#1c1340","#3a2a4e","#5a4020","#7a5422"]
  .forEach(function(h){ vjStops.push([parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]); });
}
function introClock(){
  if(phase===2) return (introAudio2 && introAudio2.currentTime)||P2_START;
  return (introAudio && introAudio.currentTime)||0;
}
function vjFrame(ts){
  if(!vjOn) return;
  requestAnimationFrame(vjFrame);
  if(ts-vjLast<40) return;           /* ~25 fps */
  vjLast=ts;
  var at=introClock();
  var t=ts/1000;
  var energy=(phase===2)?1:0.16+0.84*Math.min(1, at/26);
  var vib=1+0.11*Math.sin(at*2*Math.PI*1.25);
  var cx=VJW*0.5+Math.sin(t*0.16)*44, cy=VJH*0.5+Math.cos(t*0.12)*26;
  var sp=t*(0.3+energy*0.6);
  var d=vjImg.data, n=vjStops.length;
  for(var y=0;y<VJH;y++){
    var wy=y+7*Math.sin(y*0.021+sp*0.7);
    var dy=(y-cy)*1.55;
    for(var x=0;x<VJW;x++){
      /* deformacao de dominio: as coordenadas fluem antes de medir o campo */
      var wx=x+9*Math.sin(y*0.045+sp*0.85)+5*Math.sin(x*0.02-sp*0.5);
      var dx=x-cx;
      var v=Math.sin(wx*0.047+sp*0.8)
           +Math.sin(wy*0.07-sp*0.55)
           +Math.sin((wx*0.027+wy*0.04)+sp*0.42)
           +Math.sin(Math.sqrt(dx*dx+dy*dy)*0.1-sp*1.35)*vib;
      v=(v+4)/8;
      v=Math.pow(v, 2.0-0.95*energy)*energy;
      /* cor continua pela rampa de paradas, sem quantizar: liquido e sem emendas */
      var f=v*(n-1); if(f<0)f=0; if(f>n-1.001)f=n-1.001;
      var i0=f|0, fr=f-i0, a2=vjStops[i0], b2=vjStops[i0+1];
      var p=(y*VJW+x)*4;
      d[p]  =a2[0]+(b2[0]-a2[0])*fr;
      d[p+1]=a2[1]+(b2[1]-a2[1])*fr;
      d[p+2]=a2[2]+(b2[2]-a2[2])*fr;
      d[p+3]=255;
    }
  }
  vjG.putImageData(vjImg,0,0);
}
function vjStart(){ if(vjOn) return; vjInit(); vjOn=true; $("vj").classList.add("on"); requestAnimationFrame(vjFrame); }

function veilK(t){

function endSequence(){
  if(endSeqDone) return; endSeqDone=true;
  hmi("endSequence");
  introDone=true; cleanupIntro();
  startRadioUnderIntro();
  var veil=$("introVeil");
  vjFade();
  $("splash").classList.add("off");
  setTimeout(function(){ $("splash").style.display="none"; }, 1500);
  $("app").classList.remove("intro");
  veil.classList.add("on");
  veil.style.transition="none"; veil.style.opacity="0.88";
  void veil.offsetWidth;
  var t0=performance.now();
  (function lift(now){
    var x=Math.min(1,(now-t0)/4200);
    veil.style.opacity=String((0.88*(1-x)).toFixed(3));
    if(x<1){ requestAnimationFrame(lift); }
    else { veil.classList.remove("on"); veil.style.transition=""; introDone=true; cleanupIntro(); }
  })(performance.now());
}
function cleanupIntro(){
  introTimers.forEach(clearTimeout);
  if(introTick){ clearInterval(introTick); introTick=null; }
}
function runIntro(){
  $("splash").classList.add("dark");
  var veil=$("introVeil");
  veil.classList.add("on"); veil.style.opacity="1";
  $("mc").classList.add("on");
  vjStart();
  setTimeout(function(){ if(!introDone) $("skipIntro").classList.add("on"); }, 1500);
  setTimeout(function(){ if(!introDone) $("introCredit").classList.add("on"); }, 2600);
  introAudio=new Audio(P1_SRC);
  introAudio.preload="auto";
  try{ introAudio.volume=Math.max(0, Math.min(1, masterVol/100)); }catch(e){}
  introAudio.addEventListener("error", function(){ if(phase===1 && !p2Started) finishIntro(); });
  introAudio.play().catch(function(err){
    if(err && err.name==="NotAllowedError"){ waitGesture(); }
    else { finishIntro(); }
  });
  /* a segunda faixa comeca a carregar ja */
  introAudio2=new Audio(P2_SRC);
  introAudio2.preload="auto";
  introAudio2.addEventListener("error", function(){ hmi("p2 error ev"); if(phase===2 && !endSeqDone){ startRadioUnderIntro(); endSequence(); } });
  /* sem progresso em 8 s (e sem espera por gesto): a emissao nao fica presa ao arquivo */
  introTimers.push(setTimeout(function(){
    if(!introDone && !awaitingGesture && phase===1 && (!introAudio || introAudio.currentTime<0.4)) finishIntro();
  }, 8000));
  var p1Fading=false;
  introTick=setInterval(function(){
    if(introDone) return;
    if(phase===1){
      var t=(introAudio && introAudio.currentTime)||0;
      veil.style.opacity=veilK(t).toFixed(3);
      while(mcShown<MC_LINES.length && t>=MC_AT[mcShown]){ showLine(mcShown); mcShown++; }
      if(!p1Fading && t>=P1_FADE){ p1Fading=true; fadeAudio(introAudio, 1.5, startP2); }
      if(t>=HARD1){ p1Fading=true; fadeAudio(introAudio, 0.6, startP2); }
    } else {
      var t2=(introAudio2 && introAudio2.currentTime)||0;
      HMI.p2t=t2;
      if(t2>=P2_PREP) startRadioUnderIntro();
      if(!p2Fading && t2>=P2_FADE && (firstLogged || t2>=HARD2)){
        p2Fading=true; hmi("p2 fade @"+t2.toFixed(1));
        fadeAudio(introAudio2, 1.5, endSequence);
      }
      if(t2>=HARD2+2 && !endSeqDone){ hmi("p2 hard @"+t2.toFixed(1)); endSequence(); }
    }
  }, 120);
}
function finishIntro(){
  /* o salto: despacha tudo e entrega a emissao */
  if(introDone) return; introDone=true;
  awaitingGesture=false;
  cleanupIntro();
  if(introAudio) fadeAudio(introAudio, 0.45);
  if(introAudio2) fadeAudio(introAudio2, 0.45);
  if(vjOn && !$("vj").classList.contains("out")) vjFade();
  var veil=$("introVeil");
  veil.style.opacity="0";
  setTimeout(function(){ veil.classList.remove("on"); }, 600);
  $("splash").classList.add("off");
  setTimeout(function(){ $("splash").style.display="none"; }, 1000);
  $("app").classList.remove("intro");
  startRadioUnderIntro();
}
$("skipIntro").addEventListener("click", finishIntro);

/* ---------------- arranque automatico: sem ecra de press play ---------------- */
function firstGesture(){
  FX.resume();
  setTimeout(function(){
    if(FX._pendingNeedle){ FX._pendingNeedle=false; if(window.HMFX) HMFX.needle(); }
    if(radioOn && !muted){
      var p=P[activeKey];
      try{ p.yt.unMute(); p.yt.playVideo(); }catch(e){}
    }
  }, 120);
}
document.addEventListener("pointerdown", firstGesture, {once:true});
document.addEventListener("keydown", firstGesture, {once:true});
(function autoStart(){
  FX.init();
  $("app").classList.add("on");
  $("app").classList.add("intro");
  buildQueue(); applyBlockTheme();
  pendingFirst = nextTrack();
  setNow(pendingFirst, false);
  loadApi();
  maybeStart();
  runIntro();
})();

var firstRampPending=false, rampDur=4500;
function rampInFirst(){
  if(!firstRampPending) return;
  firstRampPending=false;
  /* lenta e constante, em linha reta */
  var p=P[activeKey], DURR=rampDur;
  rampDur=4500;
  animClock(DURR, function(x){ fadeVol(p, x); }, function(){ FX.crackle(false); });
}
window.HMFX = {
  needle: function(){
    if(!FX.ctx || FX.ctx.state!=="running"){ FX._pendingNeedle=true; return; }
    FX.needleDrop(); FX.crackleBurst(2.4); rampInFirst();
  },
  lift: function(){
    if(!FX.ctx || FX.ctx.state!=="running") return;
    FX.needleLift(); FX.crackleBurst(1.3);
  }
};

window.HMENG = { startTransition:startTransition, hardNext:hardNext, state:function(){
  return { active:activeKey, rigDeck:rigDeck, transitioning:transitioning, radioOn:radioOn, simple:SIMPLE };
}};

})();
</script>
