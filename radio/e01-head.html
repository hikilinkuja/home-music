<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Music</title>
<meta name="description" content="Home Music. A 24-hour selector: dub to jungle to techno, performed by the rig, programmed by the clock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a full-screen performing rig; the radio chrome floats over it. */
:root{
  --ink:#07070e;
  --panel:#0d0d19;
  --panel2:#131022;
  --line:#242138;
  --paper:#f4ecd9;
  --dim:#8d90b0;
  --red:#e8392c;
  --red-deep:#7e140f;
  --amber:#ffb12b;
  --teal:#41d9c8;
  --alu:#cdd2e4;
  --display:'Anton', 'Arial Narrow', sans-serif;
  --mono:'IBM Plex Mono', 'Courier New', monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--paper);
  font-family:var(--mono); font-size:14px; line-height:1.5;
  overflow:hidden;
}
::selection{background:var(--red); color:var(--paper)}
a{color:var(--amber); text-decoration:none}
a:hover{color:var(--paper)}
button{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

#px{position:fixed; inset:0; z-index:1; display:block; width:100vw; height:100vh;
  object-fit:contain; image-rendering:pixelated; background:#080714; touch-action:none}

/* ---------- splash + MC intro : sob a lua ---------- */
#splash{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 2px, rgba(0,0,0,0) 2px 4px),
    radial-gradient(circle at 74% 26%, rgba(255,177,43,0.16), rgba(0,0,0,0) 38%),
    rgba(6,5,17,0.82);
  transition:opacity 1s ease;
}
#splash.off{opacity:0; pointer-events:none}
.sp-inner{text-align:center; padding:20px; max-width:560px}
.sp-bar{width:84px; height:3px; background:var(--amber); margin:0 auto 20px; box-shadow:0 0 10px rgba(255,177,43,.6)}
.sp-title{
  font-family:var(--mono); font-weight:700; font-size:clamp(30px,7vw,44px); line-height:1.1;
  letter-spacing:.34em; margin:0 0 10px; color:var(--paper); text-transform:uppercase;
  text-shadow:3px 3px 0 #000, 0 0 18px rgba(255,177,43,.25);
}
.sp-sub{color:var(--teal); font-size:11px; letter-spacing:.3em; text-transform:uppercase; margin-bottom:30px}
#tapHint{display:none; margin-top:30px; color:var(--amber); font-size:11px; letter-spacing:.34em;
  text-transform:uppercase; cursor:pointer; animation:tapPulse 1.7s ease-in-out infinite}
#tapHint.on{display:block}
@keyframes tapPulse{0%,100%{opacity:.3}50%{opacity:1}}
/* a camada vj da abertura: plasma liquido mate, por cima do palco, por baixo do veu;
   sem pixelated: o upscale bilinear da a suavidade liquida */
#vj{position:fixed; inset:0; z-index:2; width:100vw; height:100vh; display:none;
  background:#000; opacity:1; transition:opacity 2.6s linear}
#vj.on{display:block}
#vj.out{opacity:0}
#mc{transition:opacity 1.4s ease}
#mc{display:none; text-align:left; min-height:200px}
#mc.on{display:block}
.mc-line{
  font-size:14px; letter-spacing:.14em; color:var(--paper); opacity:0; transform:translateY(8px);
  transition:opacity .45s ease, transform .45s ease; margin:9px 0; text-transform:uppercase;
}
.mc-line.show{opacity:1; transform:none}
.mc-line.big{font-size:clamp(22px,4.6vw,30px); letter-spacing:.3em; color:var(--amber); text-shadow:2px 2px 0 #000}
#skipIntro{
  position:fixed; right:18px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:81;
  display:none; cursor:pointer; background:none; border:1px solid var(--line); color:var(--dim);
  font-size:10px; letter-spacing:.24em; text-transform:uppercase; padding:8px 13px;
}
#skipIntro.on{display:block}
#skipIntro:hover{color:var(--amber); border-color:var(--amber)}
/* o disco de abertura: veu negro que clareia com a musica */
#introVeil{position:fixed; inset:0; z-index:79; background:#000; opacity:0;
  pointer-events:none; transition:opacity .3s linear; display:none}
#introVeil.on{display:block}
#splash.dark{background:transparent}
#introCredit{position:fixed; left:18px; bottom:calc(16px + env(safe-area-inset-bottom,0px));
  z-index:81; display:none; color:var(--dim); font-size:9px; letter-spacing:.2em;
  text-transform:uppercase; text-align:left; line-height:1.9; opacity:0; transition:opacity 1.2s ease}
#introCredit.on{display:block; opacity:1}
#introCredit b{color:var(--amber); font-weight:500}

/* ---------- top bar ---------- */
#app{display:none}
#app.on{display:block}
/* durante a abertura, a moldura da radio fica invisivel (sem display:none,
   para o leitor montar); entra em fade quando o veu abre */
#top,#hud,#needle{transition:opacity 1.4s ease}
#app.intro #top, #app.intro #hud, #app.intro #needle, #app.intro #toast{opacity:0; pointer-events:none}
#top{
  position:fixed; left:0; right:0; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
  background:linear-gradient(to bottom, rgba(7,7,14,.88), rgba(7,7,14,0));
}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand b{font-family:var(--display); font-weight:400; font-size:22px; letter-spacing:.04em; color:var(--paper); text-shadow:2px 2px 0 var(--red); white-space:nowrap}
.brand span{color:var(--teal); font-size:10px; letter-spacing:.34em; white-space:nowrap; text-transform:uppercase}
.onair{display:flex; align-items:center; gap:9px; color:var(--dim); font-size:11px; letter-spacing:.18em; text-transform:uppercase; text-align:center}
.onair .dot{width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 10px var(--red); animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
#blockLabel{color:var(--paper)}
.hdr-btns{display:flex; align-items:center; gap:8px}
#clock{font-size:15px; color:var(--amber); letter-spacing:.14em; font-variant-numeric:tabular-nums; margin-right:6px}
.tbtn{
  cursor:pointer; background:rgba(7,7,14,.55); border:1px solid var(--line); color:var(--dim);
  padding:6px 11px; letter-spacing:.18em; font-size:10px; text-transform:uppercase;
  font-family:var(--mono); text-decoration:none; display:inline-flex; align-items:center;
}
.tbtn:hover,.tbtn.on{color:var(--amber); border-color:var(--amber)}

/* ---------- HUD : monitor + now playing ---------- */
#hud{
  position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px));
  z-index:30; display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; pointer-events:none;
}
#hud > *{pointer-events:auto}
.vidpanel{
  flex:0 0 356px; max-width:356px; background:var(--panel);
  border:2px solid #3a3560; box-shadow:0 0 0 1px #090812, 0 14px 40px rgba(0,0,0,.6);
  border-radius:8px; overflow:hidden;
}
.vp-top{display:flex; align-items:center; justify-content:space-between; padding:5px 9px;
  border-bottom:1px solid var(--line); background:linear-gradient(#1b1830,#12101f)}
.vp-top .lab{font-size:9px; letter-spacing:.26em; color:var(--dim); text-transform:uppercase}
.vp-top .dot{width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); animation:blink 1.4s infinite}
.vp-screen{position:relative; aspect-ratio:16/10; min-height:202px; background:#000}
.yt-slot{position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease; pointer-events:none}
.yt-slot.live{opacity:1; pointer-events:auto}
.yt-slot iframe{width:100%; height:100%}
#standby{
  position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; gap:6px;
  align-items:center; justify-content:center; text-align:center; padding:8px;
  background:repeating-linear-gradient(45deg, #0b0a14 0 14px, #0e0c1a 14px 28px);
  color:var(--dim); letter-spacing:.2em; font-size:10px; text-transform:uppercase;
  transition:opacity .8s ease;
}
#standby .big{font-family:var(--display); font-size:20px; color:var(--paper); letter-spacing:.06em; text-shadow:2px 2px 0 var(--red)}
#standby.off{opacity:0; pointer-events:none}
.vp-ctrl{display:flex; align-items:center; gap:9px; padding:7px 9px; border-top:1px solid var(--line)}
#vol{accent-color:var(--amber); width:100%; min-width:60px}
#muteBtn{padding:5px 9px}

#now{
  flex:1 1 300px; min-width:272px; max-width:520px;
  background:linear-gradient(135deg, rgba(13,13,25,.92), rgba(19,16,34,.92));
  border:1px solid var(--line); border-left:4px solid var(--blk, var(--amber));
  padding:12px 16px 12px; backdrop-filter:blur(5px);
}
.chiprow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
#gChip{font-size:10px; letter-spacing:.24em; text-transform:uppercase; padding:3px 9px; color:var(--ink); background:var(--blk, var(--amber)); font-weight:700}
#tYear{color:var(--dim); font-size:12px; letter-spacing:.2em}
#tBpm{color:var(--amber); font-size:10px; letter-spacing:.22em; border:1px solid rgba(255,177,43,.35); padding:2px 6px}
#tArtist{font-family:var(--display); font-weight:400; font-size:clamp(22px, 3vw, 30px); margin:6px 0 0; line-height:1.05; text-transform:uppercase; letter-spacing:.015em}
#tTitle{color:var(--amber); font-size:15px; margin:3px 0 7px; letter-spacing:.04em}
#tBlurb{color:var(--paper); opacity:.82; margin:0 0 10px; font-size:12.5px; max-height:5.6em; overflow-y:auto}
.t-links{display:flex; gap:9px; flex-wrap:wrap}
.t-links a{
  border:1px solid var(--line); padding:5px 10px; font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--paper); background:rgba(255,255,255,.03);
}
.t-links a:hover{border-color:var(--amber); color:var(--amber)}

#needle{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60;
  display:none; cursor:pointer; border:2px solid var(--amber); width:auto;
  color:var(--amber); background:rgba(7,7,14,.9);
  font-size:13px; letter-spacing:.3em; text-transform:uppercase; padding:16px 26px;
}
#needle.on{display:block}

/* ---------- side panels ---------- */
.panel{
  position:fixed; top:0; bottom:0; width:min(380px, 94vw); z-index:70;
  background:rgba(10,10,20,.97); border-color:var(--line);
  padding:calc(18px + env(safe-area-inset-top, 0px)) 20px 24px; overflow-y:auto;
  transition:transform .35s ease;
}
#genrePanel{left:0; border-right:1px solid var(--line); transform:translateX(-102%); width:min(640px,96vw)}
@media (min-width:720px){
  #genrePanel #gExt{display:grid; grid-template-columns:1fr 1fr; gap:2px 20px; align-items:start}
  #genrePanel #gExt blockquote{grid-column:1/-1}
  #genrePanel #gExt .gx-note{grid-column:1/-1}
}
#dancePanel{right:0; border-left:1px solid var(--line); transform:translateX(102%)}
#histPanel{right:0; border-left:1px solid var(--line); transform:translateX(102%)}
.panel.on, #genrePanel.on, #histPanel.on, #dancePanel.on{transform:translateX(0)}
.panel h3{font-family:var(--display); font-weight:400; letter-spacing:.06em; font-size:20px; margin:4px 0 2px; text-transform:uppercase; text-shadow:2px 2px 0 var(--red)}
.panel .pclose{position:absolute; top:14px; right:14px; background:none; border:1px solid var(--line); color:var(--dim); cursor:pointer; padding:4px 9px}
.panel .psub{color:var(--dim); font-size:10px; letter-spacing:.3em; text-transform:uppercase; margin:0 0 14px}
#gName{color:var(--amber); font-size:13px; letter-spacing:.22em; text-transform:uppercase; margin:14px 0 6px}
#gNote{color:var(--paper); opacity:.85; font-size:13px}
#gTrackCount{color:var(--dim); font-size:11px; margin-top:12px}
.g-links{display:flex; flex-direction:column; gap:8px; margin-top:18px}
.g-links a{font-size:11px; letter-spacing:.14em; text-transform:uppercase; border:1px solid var(--line); padding:8px 11px; color:var(--paper); background:rgba(255,255,255,.03)}
.g-links a:hover{border-color:var(--amber); color:var(--amber)}
.credits{margin-top:26px; border-top:1px dashed var(--line); padding-top:14px; color:var(--dim); font-size:11px}
.credits b{color:var(--paper); font-weight:500}
#histList{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
#histList li{border-bottom:1px dashed var(--line); padding-bottom:10px}
#histList .h-time{color:var(--dim); font-size:10px; letter-spacing:.2em}
#histList .h-art{color:var(--paper); font-weight:700; font-size:13px}
#histList .h-tit{color:var(--amber); font-size:12px}
#histList .h-links{margin-top:3px; font-size:10px; letter-spacing:.14em}
#histList .h-links a{margin-right:12px}
.h-empty{color:var(--dim); font-size:12px}

/* ---------- the dance nearby + painel estendido ---------- */
.dance-row{display:flex; gap:8px; margin:0 0 12px}
#danceCity{flex:1; background:#0b0918; border:1px solid var(--line); color:var(--paper);
  font-family:var(--mono); font-size:12px; padding:8px 10px; letter-spacing:.08em}
.dance-list{list-style:none; margin:0; padding:0}
.dance-list li{padding:8px 0; border-bottom:1px dotted var(--line)}
.dance-list a{color:var(--teal); text-decoration:none; font-size:12px}
.dance-list a:hover{color:var(--amber)}
.dance-note{color:var(--dim); font-size:10.5px; letter-spacing:.06em; line-height:1.7; margin-top:10px}
.dance-meta{display:block; color:var(--dim); font-size:9.5px; letter-spacing:.08em; margin-top:2px}
.dance-more{display:block; color:var(--amber); font-size:9px; letter-spacing:.2em; text-transform:uppercase; padding:4px 0}

#gExt{margin-top:16px; border-top:1px dashed var(--line); padding-top:12px}
#gExt blockquote{margin:0 0 12px; padding:10px 12px; border-left:3px solid var(--amber);
  background:rgba(255,177,43,.05); color:#d8d2e4; font-size:12px; line-height:1.65}
#gExt blockquote cite{display:block; margin-top:6px; font-style:normal; font-size:9.5px;
  letter-spacing:.14em; text-transform:uppercase}
#gExt blockquote cite a{color:var(--dim)}
.gx-h{font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:var(--amber); margin:12px 0 6px}
.gx-list{list-style:none; margin:0; padding:0}
.gx-list li{padding:5px 0; font-size:11.5px; border-bottom:1px dotted var(--line)}
.gx-list li a{color:var(--teal); text-decoration:none}
.gx-list li span{display:block; color:var(--dim); font-size:10px; letter-spacing:.08em}
.gx-p{color:#c9c4d8; font-size:11.5px; line-height:1.65; margin:0}
.gx-p a{color:var(--teal); text-decoration:none}
.gx-note{color:var(--dim); font-size:10px; letter-spacing:.08em; margin:12px 0 0}


/* ---------- a prateleira das mixtapes: gaveta sobre a emissao ---------- */
.drawer{position:fixed; inset:3% 3.5%; z-index:74; display:none; overflow:auto;
  background:rgba(6,5,17,.97); border:1px solid var(--amber); padding:0}
.drawer.on{display:block}
.dw-in{padding:24px 26px 30px; max-width:860px; margin:0 auto; position:relative}
.dw-title{margin:0 0 4px; font-size:16px; letter-spacing:.3em; text-transform:uppercase; color:var(--amber)}
.dw-sub{margin:0 0 18px; color:var(--dim); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; line-height:1.8}
.dw-tape{border:1px solid var(--line); background:rgba(13,11,28,.85); padding:14px 16px; margin:0 0 16px}
.dw-tape h4{margin:0 0 10px; font-size:13px; letter-spacing:.1em; text-transform:uppercase}
.dw-tape h4 span{display:block; margin-top:3px; color:var(--teal); font-size:9px; letter-spacing:.2em}
.dw-tape iframe{width:100%; height:150px; border:1px solid var(--line); background:#000}
/* soundcloud: cromo nativo; o widget fica dobrado a 0px e so abre como ultimo recurso */
.schost{height:0; overflow:hidden; transition:height .4s ease}
.schost.unfold{height:166px; margin-top:8px}
.schost iframe.scmini{width:100%; height:166px; border:1px solid var(--line); background:#000}
.scrow{display:flex; align-items:center; gap:10px; margin-top:9px}
.scbar{flex:1; height:4px; background:rgba(244,241,231,.14); cursor:pointer; position:relative}
.scbar i.scfill{display:block; height:100%; width:0; background:var(--amber, #ffb12b)}
.sctime{font-size:10px; letter-spacing:.08em; color:var(--dim); min-width:72px; text-align:right}
.sclink{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); text-decoration:none; border-bottom:1px dotted var(--dim)}
.sclink:hover{color:var(--paper)}

.dw-yt{position:relative; width:100%; aspect-ratio:16/9; max-height:300px; background:#000; border:1px solid var(--line)}
.dw-yt iframe{width:100%; height:100%}
.dw-idle{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:10px; letter-spacing:.26em; text-transform:uppercase; background:#04030c}
.dw-ctl{display:flex; gap:8px; align-items:center; padding:9px 0 0}
.dw-now{color:var(--amber); font-size:10px; letter-spacing:.1em}
.dw-list{list-style:none; margin:10px 0 0; padding:0; counter-reset:dw}
.dw-list li{counter-increment:dw; padding:6px 0; border-bottom:1px dotted var(--line);
  font-size:11.5px; color:#c9c4d8; cursor:pointer}
.dw-list li::before{content:counter(dw,decimal-leading-zero)"  "; color:var(--dim)}
.dw-list li.on{color:var(--amber)}
.dw-list li:hover{color:var(--amber)}

/* ---------- earn the skip: o desafio do tempo ---------- */
#skill{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
  background:rgba(3,2,10,.82)}
#skill.on{display:flex}
.sk-card{position:relative; width:min(380px, 92vw); background:#0b0918; border:1px solid var(--amber);
  padding:22px 22px 18px; text-align:center}
.sk-title{font-size:14px; letter-spacing:.3em; text-transform:uppercase; color:var(--amber); margin-bottom:6px}
.sk-sub{font-size:10px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase; line-height:1.8; margin-bottom:14px}
.sk-target{font-size:11px; letter-spacing:.2em; color:var(--paper); margin-bottom:12px}
.sk-target b{color:var(--teal); font-size:15px}
#skPad{width:100%; height:92px; cursor:pointer; background:rgba(255,177,43,.07); border:2px solid var(--amber);
  color:var(--amber); font-size:16px; letter-spacing:.4em; text-transform:uppercase; font-family:var(--mono)}
#skPad:active{background:var(--amber); color:#060511}
#skPad:disabled{opacity:.35; cursor:not-allowed}
.sk-meter{margin-top:10px; font-size:12px; letter-spacing:.2em; color:var(--paper)}
.sk-meter b{color:var(--amber)}
.sk-dots{display:flex; gap:7px; justify-content:center; margin-top:10px}
.sk-dots i{width:9px; height:9px; background:#241d3c; display:block}
.sk-dots i.f{background:var(--teal)}
.sk-msg{min-height:18px; margin-top:12px; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim)}
.sk-msg.ok{color:var(--teal)} .sk-msg.bad{color:var(--red)}
.sk-close{position:absolute; right:8px; top:6px; background:none; border:none; color:var(--dim);
  font-size:16px; cursor:pointer}

#toast{
  position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top, 0px)); transform:translate(-50%, -140px); z-index:75;
  visibility:hidden;
  background:var(--panel2); border:1px solid var(--amber); color:var(--amber);
  padding:10px 18px; font-size:11px; letter-spacing:.24em; text-transform:uppercase;
  transition:transform .4s ease; max-width:92vw; text-align:center;
}
#toast.on{transform:translate(-50%, 0); visibility:visible}

@media (max-width:700px){
  .brand b{font-size:17px}
  .brand span{display:none}
  .onair{display:none}
  #clock{font-size:13px}
  .vidpanel{flex-basis:328px; max-width:328px}
  #now{min-width:200px}
  #tBlurb{max-height:4.4em}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>
<body>
