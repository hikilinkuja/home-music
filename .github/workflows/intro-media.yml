name: intro media (sfx)
# Descarrega para sfx/ as gravacoes da abertura (ops/tools/fetch_intro_media.py) e faz o commit.
# Corre so a pedido (separador Actions, «Run workflow»); com os ficheiros ja no ramo, nao faz nada.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ops/tools/fetch_intro_media.py
      - name: commit media
        run: |
          git config user.name "home-music-collector"
          git config user.email "actions@users.noreply.github.com"
          git add sfx/intro-sound-killah.mp3 sfx/vinyl-625771.mp3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v5.8-ops: intro and needle recordings in sfx (fetched by workflow)"
          git pull --rebase origin main
          git push origin HEAD:main
