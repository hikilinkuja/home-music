<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Music Liquid</title>
<style>
:root{
  /* paleta por papeis (auditoria de UI, ronda 2, escolhida pelo Paulo a 2026-10-18; ops/notes/2026-10-18/
     ui-colors.md): nenhuma cor literal fora daqui, salvo a consola Dub Desk (variaveis proprias no l08) e as
     excecoes da nota (canvas, sombras e gradientes); ops/tests/t-ui.js verifica */
  --bg:#000000; --ink:#060511; --surface:#0b0918;
  --panel:rgba(6,5,17,.95); --glass:rgba(5,4,16,.8); --chrome:rgba(5,4,16,.6); --scrim:rgba(3,2,10,.82);
  --paper:#f4ecd9; --text:#c9c4d8; --dim:#8d90b0;
  --amber:#ffb12b; --teal:#41d9c8; --red:#e8392c; --line:#3b3560;
  --amber-soft:rgba(255,177,43,.06); --amber-edge:rgba(255,177,43,.35);
  --teal-soft:rgba(65,217,200,.06); --teal-glow:rgba(65,217,200,.15); --teal-edge:rgba(65,217,200,.45);
  --red-soft:rgba(232,57,44,.3);
  --blk:var(--amber);   /* acento do bloco: o motor muda-o (l05, setNow) */
  /* tipografia por papeis (auditoria de UI, ronda 3; ops/notes/2026-10-18/ui-type.md): cinco tamanhos e dois
     espacamentos; as maiusculas so em rotulos, botoes e titulos curtos; ops/tests/t-ui.js verifica */
  /* tamanhos fluidos (2026-10-21): iguais ate 1440 px de largura; crescem ate +15% aos 2560 px (monitor grande) */
  --fs-label:clamp(10px, calc(10px + (100vw - 1440px) * .001339), 11.5px);
  --fs-small:clamp(12px, calc(12px + (100vw - 1440px) * .001607), 13.8px);
  --fs-body:clamp(13px, calc(13px + (100vw - 1440px) * .001786), 15px);
  --fs-title:clamp(14px, calc(14px + (100vw - 1440px) * .001875), 16.1px);
  --fs-head:clamp(16px, calc(16px + (100vw - 1440px) * .002143), 18.4px);
  --ls-caps:.12em; --ls-title:.2em;
  /* letra (ronda 3b, escolhida pelo Paulo a 2026-10-19; liquid/fonts/README.md): Recursive, servida pelo proprio
     site; rotulos, maiusculas, numeros e o cartao da faixa monoespacados e lineares (--fv-label, a largura de
     sempre: 0,6 do tamanho por letra), frases em minusculas e campos de texto casuais e proporcionais (--fv-text) */
  --font-label:"Recursive", "Courier New", ui-monospace, Menlo, monospace;
  --font-text:"Recursive", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:var(--font-label);
  --fv-label:"MONO" 1, "CASL" 0;
  --fv-text:"MONO" 0, "CASL" 0.6;
}
@font-face{font-family:"Recursive"; font-style:oblique 0deg 15deg; font-weight:300 1000; font-display:swap;
  src:url("fonts/recursive-latin-full-normal.woff2") format("woff2-variations"), url("fonts/recursive-latin-full-normal.woff2") format("woff2");
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Recursive"; font-style:oblique 0deg 15deg; font-weight:300 1000; font-display:swap;
  src:url("fonts/recursive-latin-ext-full-normal.woff2") format("woff2-variations"), url("fonts/recursive-latin-ext-full-normal.woff2") format("woff2");
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--paper); font-family:var(--font-text); font-variation-settings:var(--fv-text); overflow:hidden}
button{font-family:var(--mono); font-variation-settings:inherit}
input,textarea,select{font-family:var(--font-text); font-variation-settings:var(--fv-text)}
/* rotulos: o que se escreve em maiusculas ou a 10 px leva a variacao monoespacada (as regras com
   text-transform:uppercase ou --fs-label tem --fv-label); e o cartao da faixa, os relogios, os numeros do
   mostrador (o alvo do Earn a skip) e o Begin */
#tArtist, #tTitle, #clock, #fcTime, #fcClock, #fcBegin, #skTarget{font-family:var(--font-label); font-variation-settings:var(--fv-label)}
::placeholder{color:var(--dim); opacity:1}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}

/* o liquido e o proprio fundo da estacao */
#vj{position:fixed; inset:0; z-index:0; width:100vw; height:100vh; background:var(--bg)}

#app{display:none}
#app.on{display:block}

#top{
  position:fixed; left:0; right:0; top:0; z-index:40;
  display:flex; align-items:center; gap:14px; padding:12px 18px;
  background:linear-gradient(to bottom, rgba(0,0,0,.55), rgba(0,0,0,0));
}
.brand b{font-size:var(--fs-head); letter-spacing:var(--ls-title); color:var(--paper); text-shadow:2px 2px 0 rgba(0,0,0,.8)}
.brand span{margin-left:10px; font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--blk); font-variation-settings:var(--fv-label)}
.onair{display:flex; align-items:center; gap:7px; font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--dim); font-variation-settings:var(--fv-label)}
.onair .dot{width:6px; height:6px; background:var(--red); border-radius:50%; animation:blink 2.1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hdr-btns{margin-left:auto; display:flex; align-items:center; gap:8px}
#clock{font-size:var(--fs-body); letter-spacing:var(--ls-caps); color:var(--amber)}
.tbtn{
  cursor:pointer; background:var(--chrome); border:1px solid var(--line); color:var(--dim);
  font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; padding:7px 11px;
  font-family:var(--mono); text-decoration:none; display:inline-flex; align-items:center; font-variation-settings:var(--fv-label)}
.tbtn:hover{color:var(--amber); border-color:var(--amber)}
.tbtn.on{color:var(--ink); background:var(--amber); border-color:var(--amber)}
/* regresso a radio (ala da arte, sala de foco): debrum vermelho por fora, distinto dos outros
   botoes; e box-shadow e nao outline, para o contorno ambar do teclado continuar a ver-se */
.tbtn.back{border-color:var(--red); box-shadow:0 0 0 1px var(--red); color:var(--paper)}
.tbtn.back:hover{color:var(--paper); border-color:var(--red); box-shadow:0 0 0 2px var(--red);
  background:var(--red-soft)}

/* cartao da faixa: texto a flutuar sobre o liquido */
#now{
  position:fixed; left:22px; bottom:20px; z-index:30; max-width:min(560px, 58vw);
  text-shadow:0 2px 10px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9);
}
.chiprow{display:flex; gap:10px; align-items:baseline; margin-bottom:6px}
#gChip{font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--ink);
  background:var(--blk); padding:3px 8px; text-shadow:none; font-variation-settings:var(--fv-label)}
#tYear{font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--dim); font-variation-settings:var(--fv-label)}
#tBpm{font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--amber); border:1px solid var(--amber-edge); padding:2px 6px; text-shadow:none; font-variation-settings:var(--fv-label)}
#tFresh{font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--ink);
  background:var(--teal); padding:3px 7px; text-shadow:none; font-variation-settings:var(--fv-label)}
#tArtist{margin:0; font-size:clamp(20px,3.4vw,34px); letter-spacing:var(--ls-caps); text-transform:uppercase; line-height:1.08; font-variation-settings:var(--fv-label)}
#tTitle{color:var(--amber); font-size:clamp(13px,1.8vw,17px); margin:4px 0 8px}
#tBlurb{color:var(--text); font-size:var(--fs-body); line-height:1.55; margin:0; max-width:52ch;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.t-links{margin-top:9px; display:flex; gap:9px; flex-wrap:wrap}
.t-links a{color:var(--teal); text-decoration:none; font-size:var(--fs-label); letter-spacing:var(--ls-caps);
  text-transform:uppercase; border:1px solid var(--teal-edge); padding:5px 9px; background:var(--chrome); font-variation-settings:var(--fv-label)}
.t-links a:hover{border-color:var(--teal)}

/* o monitor: o menor leitor conforme, moldura mate ao canto */
.vidpanel{position:fixed; right:20px; bottom:20px; z-index:30; width:300px}
.vp-top{display:flex; justify-content:space-between; align-items:center; padding:5px 8px;
  background:var(--glass); border:1px solid var(--line); border-bottom:none;
  font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--dim); font-variation-settings:var(--fv-label)}
.vp-top .dot{width:5px;height:5px;border-radius:50%;background:var(--red)}
.vp-screen{position:relative; width:300px; height:200px; background:var(--bg); border:1px solid var(--line)}
.yt-slot{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .5s; overflow:hidden}
.yt-slot.live{opacity:1; pointer-events:auto}
.yt-slot iframe{width:100%; height:100%}
/* o prato a espera (o disco seguinte a carregar, mudo, com o anuncio do YouTube a passar calado) fica
   fora do ecra, de 1 por 1 pixel, como o leitor da sala de foco, e nunca transparente dentro do monitor:
   no ensaio de 2026-10-18 o leitor escondido por opacidade 0 tocou 11 de 20 videos em 90 s, o de fora
   do ecra 19 de 20. Entra no monitor quando vai para o ar (.live). So por CSS: mudar o iframe de sitio
   no DOM recarrega-o. No telemovel ha um so leitor (pointer:coarse, como o SIMPLE do motor) e fica
   como estava */
@media not all and (pointer:coarse){
  .yt-slot:not(.live){inset:auto; left:-9999px; top:0; width:1px; height:1px; opacity:1}
  .yt-slot.live{animation:slotIn .5s ease-out}
}
@keyframes slotIn{from{opacity:0} to{opacity:1}}
/* crop: engole as barras pretas dos rips (conteudo 4:3 dentro de video 16:9) */
.vp-screen.fill .yt-slot iframe{position:absolute; width:136%; height:136%; left:50%; top:50%;
  transform:translate(-50%,-50%)}
#standby{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:6px; background:var(--panel); z-index:3; transition:opacity .6s}
#standby.off{opacity:0; pointer-events:none}
#standby .big{font-size:var(--fs-title); letter-spacing:var(--ls-title); color:var(--red); text-transform:uppercase; font-variation-settings:var(--fv-label)}
#standbyMsg{font-size:var(--fs-small); letter-spacing:0; color:var(--dim); text-align:center; max-width:34ch}
.vp-ctrl{display:flex; gap:8px; align-items:center; padding:7px 8px;
  background:var(--glass); border:1px solid var(--line); border-top:none}
#vol{flex:1; accent-color:var(--amber); background:transparent}
/* rotulo curto no telemovel (monitor de 200 px): «Earn a skip» punha os botoes do monitor em tres filas */
.lbl-narrow{display:none}
#needle{
  position:fixed; right:20px; bottom:252px; z-index:31; display:none; cursor:pointer;
  background:var(--amber); color:var(--ink); border:none; font-size:var(--fs-label); letter-spacing:var(--ls-caps);
  text-transform:uppercase; padding:9px 12px; font-variation-settings:var(--fv-label)}
#needle.on{display:block}

/* paineis */
.panel{position:fixed; right:20px; top:54px; z-index:45; width:min(360px, 92vw);
  max-height:calc(100vh - 90px); overflow:auto; background:rgba(6,5,17,.93);
  border:1px solid var(--line); padding:16px; display:none}
.panel.on{display:block}
#genrePanel{width:min(640px,94vw)}
@media (min-width:720px){
  #genrePanel #gExt{display:grid; grid-template-columns:1fr 1fr; gap:2px 20px; align-items:start}
  #genrePanel #gExt blockquote{grid-column:1/-1}
  #genrePanel #gExt .gx-note{grid-column:1/-1}
}
.panel h3{margin:0 0 2px; font-size:var(--fs-title); letter-spacing:var(--ls-title); text-transform:uppercase; color:var(--amber); font-variation-settings:var(--fv-label)}
.psub{margin:0 0 12px; color:var(--dim); font-size:var(--fs-small); letter-spacing:0;}
.pclose{position:absolute; right:10px; top:8px; cursor:pointer; background:none; border:none;
  color:var(--dim); font-size:var(--fs-head)}
#gName{font-size:var(--fs-head); letter-spacing:var(--ls-title); text-transform:uppercase; margin-bottom:6px; font-variation-settings:var(--fv-label)}
#gNote{color:var(--text); font-size:var(--fs-small); line-height:1.6}
#gTrackCount{color:var(--dim); font-size:var(--fs-small); letter-spacing:var(--ls-caps); margin:8px 0}
.g-links{display:flex; flex-direction:column; gap:6px; margin-top:10px}
.g-links a{color:var(--teal); font-size:var(--fs-small); text-decoration:none}
.credits{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); color:var(--dim);
  font-size:var(--fs-small); line-height:1.7}
.credits b{color:var(--amber)}
#histList{list-style:none; margin:0; padding:0}
#histList li{padding:7px 0; border-bottom:1px dotted var(--line); font-size:var(--fs-small); color:var(--text)}
#histList .h-time{color:var(--dim); margin-right:7px}
/* as linhas que o motor escreve (pushHistory): artista, titulo e as duas ligacoes, separadas */
#histList .h-art{color:var(--paper); margin-top:3px}
#histList .h-tit{color:var(--amber)}
#histList .h-links{display:flex; gap:16px; margin-top:4px; font-size:var(--fs-small); letter-spacing:var(--ls-caps)}
#histList .h-links a{color:var(--teal); text-decoration:none; padding:3px 0}
#histList .h-links a:hover{color:var(--amber)}
.h-empty{color:var(--dim)}

/* a luz da sala: abre do escuro ao normal nos primeiros segundos, com a musica a subir */
#lightVeil{position:fixed; inset:0; z-index:65; background:var(--bg); opacity:.9; pointer-events:none}


#fieldName{position:fixed; left:50%; transform:translateX(-50%); top:56px; z-index:46;
  color:var(--amber); font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase;
  background:rgba(6,5,17,.85); border:1px solid var(--line); padding:7px 12px;
  opacity:0; pointer-events:none; transition:opacity .35s; font-variation-settings:var(--fv-label)}
#fieldName.on{opacity:1}

/* ---------- mobile: full bleed; navegacao em fita deslizante, alvos de toque a serio ---------- */
@media (max-width:760px){
  #top{padding:8px 10px 0; gap:4px 10px; flex-wrap:wrap;
    background:linear-gradient(to bottom, rgba(0,0,0,.8), rgba(0,0,0,.45) 68%, rgba(0,0,0,0))}
  .brand b{font-size:var(--fs-head); letter-spacing:var(--ls-title)}
  .brand span{margin-left:6px}
  .onair .lbl{display:none}
  #blockLabel{display:none}
  #clock{font-size:var(--fs-small); flex:0 0 auto; align-self:center}
  /* a fila de botoes vira fita: uma linha inteira, deslizavel ao dedo */
  .hdr-btns{flex:1 1 100%; margin-left:0; gap:8px; flex-wrap:nowrap; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:4px 0 10px}
  .hdr-btns::-webkit-scrollbar{display:none}
  .tbtn{font-size:var(--fs-label); padding:11px 13px; min-height:42px; letter-spacing:var(--ls-caps);
    flex:0 0 auto; white-space:nowrap; font-variation-settings:var(--fv-label)}
  .vidpanel{right:10px; bottom:10px; width:200px}
  .vp-screen{width:200px; height:200px}
  .vp-ctrl{padding:6px 6px; gap:6px}
  .lbl-wide{display:none}
  .lbl-narrow{display:inline}
  #needle{top:calc(env(safe-area-inset-top,0px) + 100px); bottom:auto; left:50%; right:auto;
    transform:translateX(-50%); min-height:42px; z-index:33}
  #now{left:10px; right:220px; bottom:14px; max-width:none; z-index:32}
  .chiprow{flex-wrap:wrap; gap:6px}
  #tArtist{font-size:var(--fs-head); line-height:1.15}
  #tTitle{font-size:var(--fs-small); margin:3px 0 6px}
  #tBlurb{display:none}
  .t-links{flex-direction:column; align-items:stretch; gap:6px}
  .t-links a,.t-links .tbtn{font-size:var(--fs-label); padding:10px 11px; letter-spacing:var(--ls-caps); min-height:38px; font-variation-settings:var(--fv-label)}
  .t-links a{display:inline-flex; align-items:center}
  .panel{top:102px; width:94vw; right:3vw; max-height:calc(100vh - 148px)}
  #genrePanel{width:94vw}
  .drawer{inset:2% 2.5%}
  #toast{bottom:auto; top:106px}
  #fieldName{top:150px}
}

/* ---------- the dance nearby + painel estendido ---------- */
.dance-row{display:flex; gap:8px; margin:0 0 12px}
#danceCity{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--paper);
  font-family:var(--mono); font-size:var(--fs-small); padding:8px 10px; letter-spacing:0}
.dance-list{list-style:none; margin:0; padding:0}
.dance-list li{padding:8px 0; border-bottom:1px dotted var(--line)}
.dance-list a{color:var(--teal); text-decoration:none; font-size:var(--fs-small)}
.dance-list a:hover{color:var(--amber)}
.dance-note{color:var(--dim); font-size:var(--fs-small); letter-spacing:0; line-height:1.7; margin-top:10px}
.dance-meta{display:block; color:var(--dim); font-size:var(--fs-small); letter-spacing:0; margin-top:2px}
.dance-more{display:block; color:var(--amber); font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; padding:4px 0; font-variation-settings:var(--fv-label)}

#gExt{margin-top:16px; border-top:1px dashed var(--line); padding-top:12px}
/* com o painel estendido, as ligacoes do topo repetiam as de «Go deeper»: ficam so as de baixo */
#genrePanel:has(#gExt:not([hidden])) .g-links{display:none}
#gExt blockquote{margin:0 0 12px; padding:10px 12px; border-left:3px solid var(--amber);
  background:var(--amber-soft); color:var(--text); font-size:var(--fs-small); line-height:1.65}
#gExt blockquote cite{display:block; margin-top:6px; font-style:normal; font-size:var(--fs-small);
  letter-spacing:0;}
#gExt blockquote cite a{color:var(--dim)}
.gx-h{font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--amber); margin:12px 0 6px; font-variation-settings:var(--fv-label)}
.gx-list{list-style:none; margin:0; padding:0}
.gx-list li{padding:5px 0; font-size:var(--fs-small); border-bottom:1px dotted var(--line)}
.gx-list li a{color:var(--teal); text-decoration:none}
.gx-list li span{display:block; color:var(--dim); font-size:var(--fs-small); letter-spacing:0}
.gx-p{color:var(--text); font-size:var(--fs-small); line-height:1.65; margin:0}
.gx-p a{color:var(--teal); text-decoration:none}
.gx-note{color:var(--dim); font-size:var(--fs-small); letter-spacing:0; margin:12px 0 0}


/* ---------- a prateleira das mixtapes: gaveta sobre a emissao ---------- */
.drawer{position:fixed; inset:3% 3.5%; z-index:60; display:none; overflow:auto;
  background:rgba(6,5,17,.97); border:1px solid var(--amber); padding:0}
.drawer.on{display:block}
.dw-in{padding:24px 26px 30px; max-width:860px; margin:0 auto; position:relative}
.dw-title{margin:0 0 4px; font-size:var(--fs-head); letter-spacing:var(--ls-title); text-transform:uppercase; color:var(--amber); font-variation-settings:var(--fv-label)}
.dw-sub{margin:0 0 18px; color:var(--dim); font-size:var(--fs-small); letter-spacing:0; line-height:1.8}
.dw-tape{border:1px solid var(--line); background:var(--surface); padding:14px 16px; margin:0 0 16px}
.dw-tape h4{margin:0 0 10px; font-size:var(--fs-body); letter-spacing:0;}
.dw-tape h4 span{display:block; margin-top:3px; color:var(--teal); font-size:var(--fs-small); letter-spacing:var(--ls-caps)}
.dw-tape iframe{width:100%; height:150px; border:1px solid var(--line); background:var(--bg)}
/* soundcloud: cromo nativo; o widget fica dobrado a 0px e so abre como ultimo recurso */
.schost{height:0; overflow:hidden; transition:height .4s ease}
.schost.unfold{height:166px; margin-top:8px}
.schost iframe.scmini{width:100%; height:166px; border:1px solid var(--line); background:var(--bg)}
.scrow{display:flex; align-items:center; gap:10px; margin-top:9px}
.scbar{flex:1; height:4px; background:var(--line); cursor:pointer; position:relative}
.scbar i.scfill{display:block; height:100%; width:0; background:var(--amber)}
.sctime{font-size:var(--fs-small); letter-spacing:0; color:var(--dim); min-width:72px; text-align:right}
.sclink{font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; color:var(--dim); text-decoration:none; border-bottom:1px dotted var(--dim); font-variation-settings:var(--fv-label)}
.sclink:hover{color:var(--paper)}

.dw-yt{position:relative; width:100%; aspect-ratio:16/9; max-height:300px; background:var(--bg); border:1px solid var(--line)}
.dw-yt iframe{width:100%; height:100%}
.dw-idle{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--dim); font-size:var(--fs-small); letter-spacing:0; background:var(--ink)}
.dw-ctl{display:flex; gap:8px; align-items:center; padding:9px 0 0}
.dw-now{color:var(--amber); font-size:var(--fs-small); letter-spacing:0}
.dw-list{list-style:none; margin:10px 0 0; padding:0; counter-reset:dw}
.dw-list li{counter-increment:dw; padding:6px 0; border-bottom:1px dotted var(--line);
  font-size:var(--fs-small); color:var(--text); cursor:pointer}
.dw-list li::before{content:counter(dw,decimal-leading-zero)"  "; color:var(--dim)}
.dw-list li.on{color:var(--amber)}
.dw-list li:hover{color:var(--amber)}

/* ---------- earn the skip ---------- */
#skill{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  background:var(--scrim)}
#skill.on{display:flex}
.sk-card{position:relative; width:min(380px, 92vw); background:var(--surface); border:1px solid var(--amber);
  padding:22px 22px 18px; text-align:center}
.sk-title{font-size:var(--fs-title); letter-spacing:var(--ls-title); text-transform:uppercase; color:var(--amber); margin-bottom:6px; font-variation-settings:var(--fv-label)}
.sk-sub{font-size:var(--fs-small); letter-spacing:0; color:var(--dim); line-height:1.8; margin-bottom:14px}
.sk-target{font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--paper); margin-bottom:12px; font-variation-settings:var(--fv-label)}
.sk-target b{color:var(--teal); font-size:var(--fs-title)}
#skPad{width:100%; height:92px; cursor:pointer; background:var(--amber-soft); border:2px solid var(--amber);
  color:var(--amber); font-size:var(--fs-head); letter-spacing:var(--ls-title); text-transform:uppercase; font-family:var(--mono); font-variation-settings:var(--fv-label)}
#skPad:active{background:var(--amber); color:var(--ink)}
#skPad:disabled{opacity:.35; cursor:not-allowed}
.sk-meter{margin-top:10px; font-size:var(--fs-title); letter-spacing:var(--ls-title); color:var(--paper)}
.sk-meter b{color:var(--amber)}
.sk-dots{display:flex; gap:7px; justify-content:center; margin-top:10px}
.sk-dots i{width:9px; height:9px; background:var(--line); display:block}
.sk-dots i.f{background:var(--teal)}
.sk-msg{min-height:18px; margin-top:12px; font-size:var(--fs-small); letter-spacing:0; color:var(--dim)}
.sk-msg.ok{color:var(--teal)} .sk-msg.bad{color:var(--red)}
.sk-close{position:absolute; right:8px; top:6px; background:none; border:none; color:var(--dim);
  font-size:var(--fs-head); cursor:pointer}

#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:240px; z-index:50;
  background:rgba(6,5,17,.95); border:1px solid var(--blk); color:var(--paper);
  font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; padding:9px 14px;
  opacity:0; pointer-events:none; transition:opacity .4s; font-variation-settings:var(--fv-label)}
#toast.on{opacity:1}

/* ---------- a abertura da sala liquida: so o disco 2, depois a agulha ---------- */
#splash{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:var(--bg); transition:opacity 1s ease}
#splash.off{opacity:0; pointer-events:none}
.sp-inner{text-align:center; padding:20px; max-width:560px}
#tapHint{display:block; margin-top:26px; color:var(--amber); font-size:var(--fs-label); letter-spacing:var(--ls-caps);
  text-transform:uppercase; cursor:pointer; animation:tapPulse 1.7s ease-in-out infinite; font-variation-settings:var(--fv-label)}
@keyframes tapPulse{0%,100%{opacity:.3}50%{opacity:1}}
#mc{display:none; text-align:left; min-height:200px; width:min(88vw,440px); transition:opacity 1.4s ease}
#mc.on{display:block}
.mc-line{font-size:var(--fs-title); letter-spacing:var(--ls-title); color:var(--paper); opacity:0; transform:translateY(8px);
  transition:opacity .45s ease, transform .45s ease; margin:9px 0; text-transform:uppercase; font-variation-settings:var(--fv-label)}
.mc-line.show{opacity:1; transform:none}
.mc-line.big{font-size:clamp(22px,4.6vw,30px); letter-spacing:var(--ls-caps); color:var(--amber); text-shadow:2px 2px 0 var(--bg)}
#skipIntro{position:fixed; right:18px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:81;
  cursor:pointer; background:none; border:1px solid var(--line); color:var(--dim);
  font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; padding:8px 13px; font-variation-settings:var(--fv-label)}
#skipIntro:hover{color:var(--amber); border-color:var(--amber)}
#introCredit{position:fixed; left:18px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:81;
  color:var(--dim); font-size:var(--fs-small); letter-spacing:0; pointer-events:none; text-align:left; line-height:1.9; opacity:0; transition:opacity 1.2s ease}
#introCredit.on{opacity:1}
#introCredit b{color:var(--amber); font-weight:500}

/* ---------- weekly art installation: a sala inteira para a obra ---------- */
/* o palco: a obra fica entre a barra de cima e o cartao de baixo, nunca por baixo deles;
   --wa-bh (fundo da barra) e --wa-ch (do topo do cartao ao fundo) sao medidos pelo l06.
   No telemovel deitado a barra e o cartao passam a coluna a esquerda (ver mais abaixo).
   touch-action:none: o pinch amplia a obra e nao a pagina; a ficha continua a deslizar */
#wart{position:fixed; inset:0; z-index:90; display:none; background:var(--ink); touch-action:none;
  --wa-bh:56px; --wa-ch:130px; --wa-l:0px; --wa-st:var(--wa-bh); --wa-sb:calc(var(--wa-ch) + 6px)}
#wart.on{display:block}
#waVid,#waPicWrap,#waVeil{position:absolute; left:var(--wa-l); top:var(--wa-st);
  width:calc(100% - var(--wa-l)); height:calc(100% - var(--wa-st) - var(--wa-sb))}
/* o filme inteiro, como as telas: contain, nada fica cortado em nenhum ecra */
#waVid{object-fit:contain; display:none; filter:brightness(.82) contrast(1.03)}
#waPicWrap{overflow:hidden; display:none}
/* a obra inteira, sempre: contain, sem recorte nem filtro (semanal e diaria) */
#waPic{position:absolute; left:50%; top:50%; width:100%; height:100%; object-fit:contain;
  transform:translate(-50%,-50%)}
/* lente de leitura (so computador): banda de lado a lado; o rato dita o detalhe */
#waLens{position:absolute; left:0; right:0; height:36vh; top:50%; transform:translateY(-50%);
  display:none; z-index:2; pointer-events:none; background-repeat:no-repeat; background-color:var(--bg);
  border-top:1px solid var(--dim); border-bottom:1px solid var(--dim);
  box-shadow:0 0 0 2000px rgba(0,0,0,.38)}
#waPicWrap.lensing #waLens{display:block}
#waCv{position:absolute; inset:0; width:100%; height:100%; display:none}
#waVeil{pointer-events:none; display:none;
  background:radial-gradient(ellipse at 50% 46%, rgba(6,5,17,0) 44%, rgba(6,5,17,.72) 100%)}
/* poema: voz dactilografada da casa (escolha do fundador); vive no palco, nunca desce ate ao cartao */
#waPoem{position:absolute; left:var(--wa-l); right:0; top:var(--wa-st); bottom:var(--wa-sb); display:none;
  align-items:center; justify-content:center; text-align:left; padding:0 7vw; overflow:hidden}
#waPoemLines{transition:transform .9s ease, opacity .8s ease}
#waPoemLines div{font-family:var(--mono); font-size:var(--fs-title); letter-spacing:0; line-height:2.05;
  color:var(--paper); text-shadow:0 0 22px var(--teal-glow); opacity:0; transition:opacity 1.2s ease;
  margin:0 0 .35em}
@media (max-width:760px){
  #waPoemLines div{font-size:var(--fs-body)}
}
/* a dica: no topo do palco, sempre dentro do ecra (parte-se em linhas se for preciso) */
#waHint{position:absolute; left:calc(50% + var(--wa-l) / 2); top:calc(var(--wa-st) + 10px);
  transform:translateX(-50%); z-index:4; width:max-content; max-width:calc(100% - var(--wa-l) - 32px);
  background:rgba(6,5,17,.85); border:1px solid var(--line); color:var(--amber); text-align:center;
  font-size:var(--fs-small); letter-spacing:0; line-height:1.7; padding:8px 12px;
  display:none}
#waHint.on{display:block}
#waPoemTitle{position:absolute; left:22px; right:22px; top:10px; font-size:var(--fs-label); letter-spacing:var(--ls-caps);
  line-height:1.7; text-align:right; color:var(--dim); text-transform:uppercase; font-variation-settings:var(--fv-label)}
/* a barra da ala: o regresso a esquerda, as duas paredes (esta semana, o quadro do dia) em
   botoes segmentados, e o Full screen; fica por cima de tudo menos da ficha da sala */
#waBar{position:absolute; left:0; right:0; top:0; z-index:2; display:flex; align-items:center; gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:linear-gradient(to bottom, rgba(0,0,0,.62), rgba(0,0,0,0))}
.wa-wings{display:flex; margin:0 auto}
.wa-wings .tbtn + .tbtn{border-left:none}
/* o cartao e so da obra: tipo, titulo, autor e a ficha da sala */
#waCap{position:absolute; left:16px; bottom:16px; max-width:min(480px,86vw);
  background:rgba(6,5,17,.78); border:1px solid var(--line); padding:11px 13px}
#waCap .k{font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--teal); text-transform:uppercase; font-variation-settings:var(--fv-label)}
#waCap .t{font-size:var(--fs-head); letter-spacing:var(--ls-title); text-transform:uppercase; margin:4px 0 2px; color:var(--paper); font-variation-settings:var(--fv-label)}
#waCap .a{font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--dim); text-transform:uppercase; font-variation-settings:var(--fv-label)}
.wa-arow{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px}
#waCap .bmore{margin:0}
/* z-index acima da dica (#waHint, 4): no telemovel a ficha ocupa o ecra e a dica tapava o artista */
#wartFicha{position:absolute; top:0; right:0; bottom:0; width:min(430px,94vw); z-index:5;
  background:var(--panel); border-left:1px solid var(--line); padding:54px 24px 28px; touch-action:pan-y;
  overflow-y:auto; transform:translateX(103%); transition:transform .45s cubic-bezier(.22,.9,.3,1)}
#wartFicha.on{transform:translateX(0)}
#wartFicha h3{margin:0 0 2px; font-size:var(--fs-title); letter-spacing:var(--ls-title); text-transform:uppercase; color:var(--amber); font-variation-settings:var(--fv-label)}
#wartFicha .fsub{font-size:var(--fs-small); letter-spacing:0; color:var(--dim); margin:0 0 16px}
#wartFicha .fk{font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--teal); text-transform:uppercase; margin:15px 0 4px; font-variation-settings:var(--fv-label)}
#wartFicha .fv{font-size:var(--fs-body); line-height:1.8; color:var(--text); margin:0}
#wartFicha .fv b{color:var(--paper); font-weight:500}
#wartFicha a{display:block; color:var(--amber); font-size:var(--fs-small); letter-spacing:0;
  text-decoration:none; border-bottom:1px dotted var(--line); padding:7px 0}
#wartFichaClose{position:absolute; right:12px; top:12px; background:none; border:none; color:var(--dim);
  font-size:var(--fs-head); cursor:pointer}
#waBadge{display:none; font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase;
  color:var(--ink); background:var(--teal); padding:3px 8px; margin:0 0 12px; font-variation-settings:var(--fv-label)}
/* navegacao entre as pecas da semana: a meia altura do palco (no telemovel, ver abaixo) */
.wa-nav{position:absolute; top:calc(var(--wa-st) + (100% - var(--wa-st) - var(--wa-sb)) / 2);
  transform:translateY(-50%); z-index:2; background:none;
  border:none; color:var(--dim); font-size:34px; cursor:pointer; padding:14px; line-height:1}
.wa-nav:hover{color:var(--amber)}
#waPrev{left:calc(var(--wa-l) + 6px)} #waNext{right:6px}
#waNum{color:var(--dim)}
/* ecra de toque: botoes da barra com alvo a serio, tambem com o telemovel deitado */
@media (pointer:coarse){
  #waBar .tbtn{font-size:var(--fs-label); padding:11px 13px; min-height:42px; letter-spacing:var(--ls-caps); white-space:nowrap; font-variation-settings:var(--fv-label)}
}
/* telemovel de pe: regresso e Immerse numa linha, as duas paredes na de baixo; as setas
   descem para uma faixa propria logo acima do cartao, fora do palco (nunca sobre a obra) */
@media (max-width:760px){
  #wart{--wa-sb:calc(var(--wa-ch) + 66px)}
  #waBar{flex-wrap:wrap; gap:6px 8px; padding:calc(8px + env(safe-area-inset-top,0px)) 10px 10px}
  #waFsBtn{margin-left:auto}
  .wa-wings{order:3; flex:1 1 100%; margin:0}
  .wa-wings .tbtn{flex:1 1 50%; justify-content:center}
  .wa-nav{top:auto; bottom:calc(var(--wa-ch) + 2px); transform:none}
}
/* telemovel deitado (ecra baixo): barra e cartao em coluna a esquerda; a obra fica com a
   altura toda a direita e nada lhe fica por cima */
@media (orientation:landscape) and (max-height:500px){
  #wart{--wa-l:calc(240px + env(safe-area-inset-left,0px)); --wa-st:0px; --wa-sb:0px}
  #waBar{right:auto; width:var(--wa-l); flex-direction:column; flex-wrap:nowrap; align-items:stretch; gap:6px;
    padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px calc(10px + env(safe-area-inset-left,0px));
    background:none}
  #waBar .tbtn{justify-content:center}
  #waFsBtn{margin-left:0}
  .wa-wings{order:0; flex:0 0 auto; margin:0}
  .wa-wings .tbtn{flex:1 1 50%; padding-left:6px; padding-right:6px}
  #waCap{left:calc(10px + env(safe-area-inset-left,0px)); bottom:8px; width:220px; max-width:none; padding:9px 11px}
  /* titulos longos do quadro do dia: tres linhas no cartao (inteiro na ficha), a coluna nao transborda */
  #waCap .t{font-size:var(--fs-title); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  /* as setas ficam na coluna, entre a barra e o cartao, e nunca sobem acima do fundo da barra:
     com um cartao alto num ecra baixo (a peca de campo a 320 px) tapavam o Full screen e roubavam-lhe
     o toque. --wa-bh inclui os 8 px de folga por baixo do ultimo botao; com 6 px de folga vertical
     as setas tem 46 px, e o 100% - --wa-bh - 40px poe-lhes o topo 2 px abaixo desse botao */
  .wa-nav{top:auto; bottom:min(calc(var(--wa-ch) + 2px), calc(100% - var(--wa-bh) - 40px)); transform:none;
    padding:6px 14px}
  #waPrev{left:calc(10px + env(safe-area-inset-left,0px))} #waNext{left:calc(var(--wa-l) - 58px); right:auto}
}

/* ---------- leitor com estaleiro: arrastar pela barra, redimensionar no canto (so computador) ---------- */
@media (min-width:761px){
  .vp-top{cursor:move; user-select:none}
  .vp-resize{position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize;
    background:linear-gradient(135deg, transparent 50%, var(--line) 50%)}
  .vidpanel{touch-action:none}
}
@media (max-width:760px){
  .vp-resize{display:none}
  #vol{display:none}
}
/* o volume nunca sai do painel: ocupa a linha de baixo, a largura que houver */
.vp-ctrl{flex-wrap:wrap}
#vol{flex:1 1 100%; width:100%; max-width:none; min-width:0; margin-top:6px}
.gx-eph{margin:12px 0 4px}
.gx-eph img{width:100%; border:1px solid var(--line); display:block}
.gx-eph figcaption{font-size:var(--fs-small); color:var(--dim); letter-spacing:0; padding-top:6px; line-height:1.8}
.gx-eph figcaption a{color:var(--teal); text-decoration:none}
#wakeBtn{display:none}
@media (max-width:760px){
  #wakeBtn.avail{display:inline-flex}
}

/* ---------- cartao: credito da oferta + estender a descricao ---------- */
#tRec{color:var(--amber); font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; margin:6px 0 0; font-variation-settings:var(--fv-label)}
#tBlurb.open{-webkit-line-clamp:unset; display:block; overflow:visible}
.bmore{background:none; border:none; border-bottom:1px dotted var(--teal); color:var(--teal);
  font-family:var(--mono); font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase;
  cursor:pointer; padding:2px 0 1px; margin:4px 0 0; font-variation-settings:var(--fv-label)}
.bmore:hover{color:var(--paper); border-color:var(--paper)}

/* ---------- suggest a tune (ids gift*) ---------- */
#giftPanel p.gift-lede{font-size:var(--fs-body); line-height:1.8; color:var(--text); margin:0 0 14px}
.gift-field{width:100%; background:var(--surface); border:1px solid var(--line); color:var(--paper);
  font-family:var(--mono); font-size:var(--fs-small); padding:8px 10px; letter-spacing:0; margin:0 0 10px}
textarea.gift-field{min-height:84px; resize:vertical}
.gift-row{display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 10px}
.gift-note{font-size:var(--fs-small); color:var(--dim); letter-spacing:0; line-height:1.8}

/* ---------- modo de estaleiro (?dev): separadores Next, Log, Banks, Engine (l09); d mostra e esconde ---------- */
#devPanel{position:fixed; left:12px; top:56px; z-index:89; width:250px; max-height:calc(100vh - 72px); overflow:auto;
  background:var(--panel); border:1px solid var(--teal); padding:8px 12px 10px; display:none; overscroll-behavior:contain}
#devPanel.on{display:block}
#devPanel.wide{width:min(780px, calc(100vw - 24px))}
#devPanel h4{margin:0 0 7px; font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--teal); text-transform:uppercase; font-variation-settings:var(--fv-label)}
#devPanel h5{margin:12px 0 4px; font-size:var(--fs-label); letter-spacing:var(--ls-caps); color:var(--amber); text-transform:uppercase; font-weight:500; font-variation-settings:var(--fv-label)}
#devTabs{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 9px; position:sticky; top:-8px; z-index:1;
  background:var(--panel); padding:4px 0}
#devTabs button{background:none; border:1px solid var(--line); color:var(--dim); font-size:var(--fs-label); letter-spacing:var(--ls-caps);
  text-transform:uppercase; padding:4px 7px; cursor:pointer; font-variation-settings:var(--fv-label)}
#devTabs button[aria-selected="true"]{border-color:var(--teal); color:var(--teal)}
#devTabs #devHide{margin-left:auto; letter-spacing:0}
.dv-pane{display:none; font-size:var(--fs-small); line-height:1.6; color:var(--text)}
.dv-pane.on{display:block}
.dv-pane p{margin:0 0 6px}
.dv-pane table{border-collapse:collapse; width:100%; margin:0 0 4px}
.dv-pane th,.dv-pane td{border-bottom:1px dotted var(--line); padding:2px 5px; text-align:left; vertical-align:top}
.dv-pane th{color:var(--teal); font-weight:500; white-space:nowrap}
.dv-pane td.n,.dv-pane th.n{text-align:right; white-space:nowrap}
.dv-pane .tbtn{margin:0 4px 4px 0}
.dv-dim{color:var(--dim)}
.dv-warn{color:var(--red)}
.dv-ok{color:var(--teal)}
.dv-blk{margin:0 0 10px; border-top:1px solid var(--line); padding-top:4px}
.dv-blk.now{border-top-color:var(--teal)}
.dv-blk.now h5{color:var(--teal)}
.dv-pane details{margin:0}
.dv-pane summary{cursor:pointer; color:var(--dim)}
.dv-pane ol{margin:2px 0 6px; padding-left:22px}
.dv-pane ol li{margin:0}
.dv-pane pre{white-space:pre-wrap; word-break:break-word; margin:0; font-size:var(--fs-small)}
.dv-scroll{overflow-x:auto}
#devNext{list-style:none; margin:0 0 9px; padding:0}
#devNext li{border-bottom:1px dotted var(--line); padding:6px 0; font-size:var(--fs-small); line-height:1.6; color:var(--text)}
#devNext li b{color:var(--paper); font-weight:500; display:block}
#devNext li span{color:var(--amber)}
#devNext li i{color:var(--teal); font-style:normal; display:block; font-size:var(--fs-label); letter-spacing:var(--ls-caps); text-transform:uppercase; font-variation-settings:var(--fv-label)}
@media (max-width:760px){
  #devPanel,#devPanel.wide{left:8px; right:8px; width:auto; top:50px; max-height:calc(100vh - 64px)}
}

/* ---------- telemovel: sugestao de audicao com o ecra fechado ---------- */
#braveTip{position:fixed; left:10px; right:10px; bottom:10px; z-index:70; display:none;
  background:var(--panel); border:1px solid var(--line); padding:12px 13px}
#braveTip.on{display:block}
#braveTip p{margin:0 0 9px; font-size:var(--fs-small); line-height:1.8; color:var(--text)}
#braveTip b{color:var(--amber); font-weight:500}
</style>
</head>
<body>
